<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual - Cliente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-600 flex items-center gap-2">
                <i data-lucide="store" class="w-6 h-6"></i> Minha Loja
            </h1>
            <div class="flex gap-2">
                <button onclick="abrirAba('pedidos')" class="relative p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                    <i data-lucide="clock" class="w-5 h-5 text-gray-700"></i>
                </button>
                <button onclick="abrirAba('carrinho')" class="relative p-2 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200 transition">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="badge-carrinho" class="absolute -top-1 -right-1 bg-orange-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal (Cardápio) -->
    <main class="max-w-md mx-auto p-4 animate-fade-in">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i data-lucide="utensils" class="w-5 h-5 text-orange-600"></i> Cardápio
        </h2>
        <div id="lista-produtos" class="space-y-4">
            <!-- Produtos injetados via JS -->
        </div>
    </main>

    <!-- Modal / Aba do Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-xl flex flex-col animate-fade-in">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-orange-600"></i> Seu Carrinho
                </h3>
                <button onclick="fecharAbas()" class="p-1 text-gray-500 hover:text-black">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="itens-carrinho" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Cards horizontais do carrinho -->
            </div>
            
            <!-- Opções de Pagamento -->
            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Forma de Pagamento:</label>
                    <select id="forma-pagamento" class="w-full p-2 bg-white border rounded-xl text-xs">
                        <option value="Pagar na Entrega">Pagar na Entrega</option>
                        <option value="Pagar no Ato (Online/Pix)">Pagar no Ato</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Meio de Pagamento:</label>
                    <select id="meio-pagamento" class="w-full p-2 bg-white border rounded-xl text-xs">
                        <option value="Pix">PIX</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>

                <div class="flex justify-between pt-2 font-bold text-lg border-t">
                    <span>Total:</span>
                    <span id="total-carrinho" class="text-orange-600">R$ 0,00</span>
                </div>
                <button onclick="finalizarPedido()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition shadow-lg shadow-green-600/20">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Finalizar Pedido
                </button>
            </div>
        </div>
    </div>

    <!-- Modal / Aba de Pedidos -->
    <div id="modal-pedidos" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-xl flex flex-col animate-fade-in">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="package" class="w-5 h-5 text-orange-600"></i> Meus Pedidos
                </h3>
                <button onclick="fecharAbas()" class="p-1 text-gray-500 hover:text-black">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="lista-meus-pedidos" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Cards horizontais de acompanhamento -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com/",
            apiKey: "AlzaSyCTkqOuXy5kHg9N8r9--Dooh8cuguYxPE",
            storageBucket: "subjectrobot-49600.appspot.com",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const produtos = [
            { id: 1, nome: "X-Burger Especial", preco: 28.90, desc: "Pão, carne artesanal, cheddar e bacon", imagem: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60" },
            { id: 2, nome: "Pizza Margherita", preco: 45.00, desc: "Molho de tomate, mussarela de búfala e manjericão", imagem: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500&auto=format&fit=crop&q=60" },
            { id: 3, nome: "Batata Frita Suprema", preco: 19.90, desc: "Porção com cheddar e bacon crocante", imagem: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500&auto=format&fit=crop&q=60" }
        ];

        let carrinho = [];

        function renderizarCardapio() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = produtos.map(p => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex gap-4 items-center">
                    <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-xl shadow-inner" alt="${p.nome}">
                    <div class="flex-1">
                        <h3 class="font-bold text-sm">${p.nome}</h3>
                        <p class="text-xs text-gray-500 line-clamp-1">${p.desc}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="font-extrabold text-orange-600 text-sm">R$ ${p.preco.toFixed(2)}</span>
                            <button onclick="adicionarAoCarrinho(${p.id})" class="bg-orange-600 hover:bg-orange-700 text-white p-2 rounded-xl transition shadow-md shadow-orange-600/20">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.adicionarAoCarrinho = function(id) {
            const prod = produtos.find(p => p.id === id);
            const itemExistente = carrinho.find(item => item.id === id);
            if (itemExistente) {
                itemExistente.qtd++;
            } else {
                carrinho.push({ ...prod, qtd: 1 });
            }
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const badge = document.getElementById('badge-carrinho');
            const totalItens = carrinho.reduce((acc, item) => acc + item.qtd, 0);
            
            if (totalItens > 0) {
                badge.innerText = totalItens;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const container = document.getElementById('itens-carrinho');
            if (carrinho.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-12"><i data-lucide="shopping-cart" class="w-12 h-12 mx-auto mb-2 opacity-50"></i><p>Seu carrinho está vazio</p></div>`;
            } else {
                container.innerHTML = carrinho.map(item => `
                    <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-100">
                        <img src="${item.imagem}" class="w-14 h-14 object-cover rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs">${item.nome}</h4>
                            <span class="text-orange-600 text-xs font-bold">R$ ${item.preco.toFixed(2)}</span>
                        </div>
                        <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border shadow-xs">
                            <button onclick="alterarQtd(${item.id}, -1)" class="text-gray-500 hover:text-black"><i data-lucide="minus" class="w-3 h-3"></i></button>
                            <span class="text-xs font-bold">${item.qtd}</span>
                            <button onclick="alterarQtd(${item.id}, 1)" class="text-gray-500 hover:text-black"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            const total = carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
            document.getElementById('total-carrinho').innerText = `R$ ${total.toFixed(2)}`;
            lucide.createIcons();
        }

        window.alterarQtd = function(id, delta) {
            const item = carrinho.find(i => i.id === id);
            if (item) {
                item.qtd += delta;
                if (item.qtd <= 0) {
                    carrinho = carrinho.filter(i => i.id !== id);
                }
            }
            atualizarCarrinhoUI();
        }

        window.finalizarPedido = async function() {
            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            try {
                const total = carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
                const formaPagamento = document.getElementById('forma-pagamento').value;
                const meioPagamento = document.getElementById('meio-pagamento').value;

                const novoPedidoRef = push(ref(db, 'pedidos'));
                const pedidoId = novoPedidoRef.key;

                const dadosPedido = {
                    id: pedidoId,
                    itens: carrinho,
                    total: total,
                    formaPagamento: formaPagamento,
                    meioPagamento: meioPagamento,
                    status: 'Aguardando confirmação da loja',
                    criadoEm: Date.now()
                };

                await set(novoPedidoRef, dadosPedido);

                let meusPedidos = [];
                try {
                    meusPedidos = JSON.parse(localStorage.getItem('meus_pedidos') || '[]');
                } catch (e) {
                    meusPedidos = [];
                }
                
                meusPedidos.push(pedidoId);
                if (meusPedidos.length > 10) meusPedidos.shift();
                localStorage.setItem('meus_pedidos', JSON.stringify(meusPedidos));

                carrinho = [];
                atualizarCarrinhoUI();
                fecharAbas();
                abrirAba('pedidos');
                carregarMeusPedidos();

                const numeroWhatsApp = "5511954962246"; 
                const mensagem = encodeURIComponent(`Olá! Meu código de pedido é: ${pedidoId}`);
                window.open(`https://wa.me/${numeroWhatsApp}?text=${mensagem}`, '_blank');
            } catch (error) {
                console.error("Erro detalhado Firebase:", error);
                alert("Erro ao enviar pedido: " + error.message);
            }
        }

        function carregarMeusPedidos() {
            let meusPedidosIds = [];
            try {
                meusPedidosIds = JSON.parse(localStorage.getItem('meus_pedidos') || '[]');
            } catch (e) {
                meusPedidosIds = [];
            }

            const container = document.getElementById('lista-meus-pedidos');

            if (meusPedidosIds.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-12"><i data-lucide="clock" class="w-12 h-12 mx-auto mb-2 opacity-50"></i><p>Nenhum pedido recente</p></div>`;
                return;
            }

            onValue(ref(db, 'pedidos'), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                container.innerHTML = '';
                meusPedidosIds.forEach(id => {
                    const pedido = data[id];
                    if (!pedido) return;

                    let corStatus = 'bg-orange-100 text-orange-700';
                    if (pedido.status === 'Preparando') corStatus = 'bg-yellow-100 text-yellow-700';
                    if (pedido.status === 'A caminho') corStatus = 'bg-blue-100 text-blue-700';
                    if (pedido.status === 'Entregue') corStatus = 'bg-green-100 text-green-700';

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-mono text-gray-400">Cód: ${id.slice(-6)}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full font-bold ${corStatus}">${pedido.status}</span>
                            </div>
                            <div class="border-t border-b py-2 space-y-1 text-xs">
                                ${pedido.itens.map(i => `<div class="flex justify-between"><span>${i.qtd}x ${i.nome}</span><span>R$ ${(i.preco * i.qtd).toFixed(2)}</span></div>`).join('')}
                            </div>
                            <div class="text-xs text-gray-500">
                                <p><strong>Pagamento:</strong> ${pedido.formaPagamento} (${pedido.meioPagamento})</p>
                            </div>
                            <div class="flex justify-between items-center text-sm font-bold pt-1 border-t">
                                <span>Total: R$ ${pedido.total.toFixed(2)}</span>
                                ${pedido.status === 'A caminho' ? `<button onclick="confirmarChegada('${id}')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-2 rounded-xl transition shadow-md flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i> Chegou</button>` : ''}
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        window.confirmarChegada = async function(id) {
            await update(ref(db, `pedidos/${id}`), { status: 'Entregue' });
            carregarMeusPedidos();
        }

        window.abrirAba = function(tipo) {
            if (tipo === 'carrinho') {
                document.getElementById('modal-carrinho').classList.remove('hidden');
            } else {
                document.getElementById('modal-pedidos').classList.remove('hidden');
                carregarMeusPedidos();
            }
        }

        window.fecharAbas = function() {
            document.getElementById('modal-carrinho').classList.add('hidden');
            document.getElementById('modal-pedidos').classList.add('hidden');
        }

        renderizarCardapio();
    </script>
</body>
</html>
