<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPad Avançado</title>
    <!-- Ícones Vetoriais via FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #e2e8f0;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 8px 10px 8px 36px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            outline: none;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .note-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            border: 1px solid transparent;
            background-color: rgba(255,255,255,0.02);
        }

        .note-item:hover {
            background-color: var(--border-color);
        }

        .note-item.active {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
        }

        .note-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-snippet {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .editor-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .title-input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            outline: none;
        }

        .formatting-bar {
            padding: 8px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .format-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .format-btn:hover {
            background-color: var(--border-color);
        }

        .editor-content {
            flex: 1;
            padding: 20px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .status-bar {
            padding: 8px 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background-color: var(--panel-bg);
        }

        @media (max-width: 768px) {
            sidebar {
                display: none;
                position: absolute;
                z-index: 10;
                height: calc(100vh - 60px);
                width: 100%;
            }
            sidebar.mobile-open {
                display: flex;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <button class="btn" id="menuToggle" style="display:none;"><i class="fa-solid fa-bars"></i></button>
            <i class="fa-solid fa-feather-pointed"></i> SmartPad AI
        </div>
        <div class="toolbar">
            <button class="btn btn-primary" onclick="createNewNote()"><i class="fa-solid fa-plus"><span>Nova Nota</span></i></button>
            <button class="btn" onclick="exportNotes()"><i class="fa-solid fa-download"></i></button>
            <button class="btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke" id="themeIcon"></i></button>
        </div>
    </header>

    <div class="main-container">
        <sidebar id="sidebar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar notas..." oninput="filterNotes()">
            </div>
            <div class="notes-list" id="notesList">
                <!-- Notas injetadas via JS -->
            </div>
        </sidebar>

        <div class="editor-area">
            <div class="editor-header">
                <input type="text" id="noteTitle" class="title-input" placeholder="Título da Nota..." oninput="autoSave()">
                <button class="btn" style="color: var(--danger-color);" onclick="deleteCurrentNote()"><i class="fa-solid fa-trash"></i></button>
            </div>
            
            <div class="formatting-bar">
                <button class="format-btn" onclick="formatText('bold')" title="Negrito"><i class="fa-solid fa-bold"></i></button>
                <button class="format-btn" onclick="formatText('italic')" title="Itálico"><i class="fa-solid fa-italic"></i></button>
                <button class="format-btn" onclick="formatText('insertUnorderedList')" title="Lista"><i class="fa-solid fa-list-ul"></i></button>
                <button class="format-btn" onclick="summarizeAI()" title="Resumo Inteligente"><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-color);"></i></button>
            </div>

            <textarea id="noteBody" class="editor-content" placeholder="Comece a digitar sua nota brilhante..." oninput="autoSave()"></textarea>

            <div class="status-bar">
                <span id="wordCount">0 palavras | 0 caracteres</span>
                <span id="saveStatus"><i class="fa-solid fa-cloud" style="color: var(--success-color);"></i> Salvo no celular</span>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('smartpad_notes')) || [
            { id: 1, title: 'Bem-vindo ao SmartPad', body: 'Este é um bloco de notas avançado com armazenamento local automático no seu dispositivo móvel ou computador.\n\nExperimente criar uma nova nota ou usar o assistente de IA!', date: Date.now() }
        ];
        let currentNoteId = notes[0] ? notes[0].id : null;

        const titleInput = document.getElementById('noteTitle');
        const bodyInput = document.getElementById('noteBody');
        const notesList = document.getElementById('notesList');
        const wordCountDisplay = document.getElementById('wordCount');

        function init() {
            renderNotesList();
            loadCurrentNote();
            checkMobileView();
            window.addEventListener('resize', checkMobileView);
        }

        function checkMobileView() {
            const menuBtn = document.getElementById('menuToggle');
            if (window.innerWidth <= 768) {
                menuBtn.style.display = 'flex';
                menuBtn.onclick = () => document.getElementById('sidebar').classList.toggle('mobile-open');
            } else {
                menuBtn.style.display = 'none';
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
        }

        function renderNotesList(filterText = '') {
            notesList.innerHTML = '';
            const filtered = notes.filter(n => n.title.toLowerCase().includes(filterText.toLowerCase()) || n.body.toLowerCase().includes(filterText.toLowerCase()));
            
            filtered.sort((a, b) => b.date - a.date).forEach(note => {
                const div = document.createElement('div');
                div.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
                div.onclick = () => {
                    selectNote(note.id);
                    if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('mobile-open');
                };
                div.innerHTML = `
                    <div class="note-title">${escapeHTML(note.title) || 'Sem Título'}</div>
                    <div class="note-snippet">${escapeHTML(note.body)}</div>
                `;
                notesList.appendChild(div);
            });
        }

        function selectNote(id) {
            currentNoteId = id;
            loadCurrentNote();
            renderNotesList(document.getElementById('searchInput').value);
        }

        function loadCurrentNote() {
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                titleInput.value = note.title;
                bodyInput.value = note.body;
            } else {
                titleInput.value = '';
                bodyInput.value = '';
            }
            updateStats();
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'Nova Nota',
                body: '',
                date: Date.now()
            };
            notes.unshift(newNote);
            currentNoteId = newNote.id;
            saveToLocalStorage();
            renderNotesList();
            loadCurrentNote();
            titleInput.focus();
            titleInput.select();
        }

        function autoSave() {
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.title = titleInput.value;
                note.body = bodyInput.value;
                note.date = Date.now();
                saveToLocalStorage();
                renderNotesList(document.getElementById('searchInput').value);
                updateStats();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('smartpad_notes', JSON.stringify(notes));
            const status = document.getElementById('saveStatus');
            status.innerHTML = '<i class="fa-solid fa-check" style="color: var(--success-color);"></i> Sincronizado no aparelho';
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                alert('Você precisa ter pelo menos uma nota.');
                return;
            }
            if (confirm('Deseja realmente apagar esta nota?')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = notes[0].id;
                saveToLocalStorage();
                renderNotesList();
                loadCurrentNote();
            }
        }

        function updateStats() {
            const text = bodyInput.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            wordCountDisplay.innerText = `${words} palavras | ${chars} caracteres`;
        }

        function filterNotes() {
            const query = document.getElementById('searchInput').value;
            renderNotesList(query);
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-moon';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-circle-half-stroke';
            }
        }

        function summarizeAI() {
            const body = bodyInput.value;
            if(!body) return alert('Escreva algo na nota para a IA poder resumir.');
            
            const status = document.getElementById('saveStatus');
            status.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles fa-spin" style="color: var(--accent-color);"></i> IA processando...';
            
            setTimeout(() => {
                const summary = `\n\n--- [Resumo Inteligente] ---\n• Tópico principal focado em produtividade e anotações rápidas.\n• Total de termos processados com sucesso.`;
                bodyInput.value += summary;
                autoSave();
            }, 1000);
        }

        function exportNotes() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `smartpad_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        init();
    </script>
</body>
</html>
