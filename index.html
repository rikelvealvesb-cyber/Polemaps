<!DOCTYPE html>
<html lang="pt-BR" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexSmart Browser - Navagador Anti-Bloqueio & Ultra Rápido</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        darkbg: '#090d16',
                        darkcard: '#111827',
                        darkborder: '#1f2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-header {
            background: rgba(9, 13, 22, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-active {
            background: rgba(17, 24, 39, 1);
            border-top: 2px solid #6366f1;
            color: #ffffff;
        }

        .tab-inactive {
            background: rgba(9, 13, 22, 0.5);
            color: #9ca3af;
        }
        .tab-inactive:hover {
            background: rgba(17, 24, 39, 0.6);
            color: #f3f4f6;
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Loading Spinner Pulse */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }
        .proxy-loading {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <header class="glass-header flex items-center justify-between px-3 py-1.5 text-xs z-50">
        <div class="flex items-center space-x-2">
            <!-- Window Controls -->
            <div class="flex items-center space-x-1.5 mr-2">
                <button title="Fechar" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600 transition flex items-center justify-center group">
                    <i class="fa-solid fa-xmark text-[8px] text-red-950 opacity-0 group-hover:opacity-100"></i>
                </button>
                <button title="Minimizar" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600 transition flex items-center justify-center group">
                    <i class="fa-solid fa-minus text-[8px] text-yellow-950 opacity-0 group-hover:opacity-100"></i>
                </button>
                <button title="Maximizar" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600 transition flex items-center justify-center group">
                    <i class="fa-solid fa-expand text-[8px] text-green-950 opacity-0 group-hover:opacity-100"></i>
                </button>
            </div>
            <div class="flex items-center space-x-2 border-l border-slate-800 pl-3">
                <i class="fa-solid fa-bolt text-indigo-400"></i>
                <span class="font-bold tracking-wide text-slate-200">ApexSmart <span class="text-indigo-400 font-mono text-[10px] bg-indigo-950/80 px-1.5 py-0.5 rounded border border-indigo-800/50">PRO v4.0</span></span>
            </div>
        </div>

        <!-- System Diagnostic Indicators -->
        <div class="flex items-center space-x-4 text-slate-400 text-[11px] font-mono">
            <span class="flex items-center space-x-1" title="Engine Proxy Bypass Ativa">
                <i class="fa-solid fa-shield-virus text-emerald-400"></i>
                <span id="proxy-status-tag" class="text-emerald-400 font-semibold">Proxy CORS: Ativo</span>
            </span>
            <span class="flex items-center space-x-1" title="Consumo Estimado de Memória">
                <i class="fa-solid fa-microchip text-indigo-400"></i>
                <span id="ram-indicator">118 MB RAM</span>
            </span>
            <span class="hidden sm:inline-block text-slate-700">|</span>
            <span id="clock-display" class="font-semibold text-slate-300">00:00:00</span>
        </div>
    </header>

    <nav class="bg-slate-950/90 border-b border-slate-800/80 flex items-center px-2 pt-1 gap-1 overflow-x-auto scrollbar-none z-40">
        <div id="tabs-container" class="flex items-center gap-1 overflow-x-auto max-w-[calc(100vw-120px)]">
            <!-- Dynamic tab buttons rendered via JS -->
        </div>
        
        <button id="btn-new-tab" onclick="createNewTab()" title="Nova Aba (Ctrl+T)" class="p-1.5 px-2.5 text-slate-400 hover:text-white hover:bg-slate-800/80 rounded-lg transition-all text-xs flex items-center gap-1">
            <i class="fa-solid fa-plus"></i>
        </button>
    </nav>

    <div class="glass-header px-3 py-2 flex items-center gap-2 z-30 shadow-lg">
        <!-- Navigation Buttons -->
        <div class="flex items-center space-x-1">
            <button onclick="navigateActiveTab('back')" title="Voltar" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white disabled:opacity-30 transition text-sm">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button onclick="navigateActiveTab('forward')" title="Avançar" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white disabled:opacity-30 transition text-sm">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button onclick="reloadActiveTab()" title="Recarregar" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm">
                <i id="reload-icon" class="fa-solid fa-rotate-right"></i>
            </button>
            <button onclick="goHome()" title="Página Inicial" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm">
                <i class="fa-solid fa-house"></i>
            </button>
        </div>

        <!-- Address Bar Input Container -->
        <div class="flex-1 relative flex items-center">
            <!-- Badge Indicator -->
            <div class="absolute left-2.5 flex items-center gap-1.5 text-slate-400 text-xs">
                <button id="security-badge" onclick="toggleProxyGlobalMode()" title="Clique para alternar o Modo Anti-Bloqueio" class="flex items-center gap-1 text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-2 py-0.5 rounded-md hover:bg-emerald-900/60 transition">
                    <i class="fa-solid fa-shield-halved text-[10px]"></i>
                    <span id="badge-proxy-text" class="hidden md:inline font-mono text-[10px]">Proxy Bypass ON</span>
                </button>
            </div>

            <input type="text" id="address-input" 
                   placeholder="Digite uma URL ou pesquise no Google/Gemini..." 
                   onkeydown="handleAddressBarKeydown(event)"
                   class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500/80 focus:ring-2 focus:ring-indigo-500/30 text-slate-100 text-sm rounded-xl pl-36 pr-32 py-1.5 transition-all outline-none font-mono shadow-inner">

            <!-- Search Engine Selector and Actions -->
            <div class="absolute right-2 flex items-center gap-1.5">
                <select id="search-engine-select" class="bg-slate-900 text-slate-300 text-[11px] rounded-lg px-2 py-1 border border-slate-700/80 focus:outline-none cursor-pointer">
                    <option value="google">🔍 Google</option>
                    <option value="gemini">🤖 Gemini IA</option>
                    <option value="duckduckgo">🦆 DuckDuckGo</option>
                    <option value="wikipedia">📚 Wikipedia</option>
                </select>

                <button onclick="toggleBookmarkCurrent()" id="star-bookmark-btn" title="Adicionar aos Favoritos" class="p-1 px-1.5 text-slate-400 hover:text-amber-400 transition text-xs">
                    <i class="fa-regular fa-star"></i>
                </button>
            </div>
        </div>

        <!-- Anti-Block Toggle Control & Utilities -->
        <div class="flex items-center space-x-1">
            <!-- Global Proxy Mode Switch Button -->
            <button id="proxy-toggle-btn" onclick="toggleProxyGlobalMode()" title="Alternar Modo Proxy Anti-Bloqueio (Resolve Conexão Recusada)" class="px-2.5 py-1.5 rounded-lg bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-600/30 font-medium text-xs flex items-center gap-1.5 transition">
                <i class="fa-solid fa-network-wired text-xs"></i>
                <span class="hidden xl:inline text-[11px]">Anti-Bloqueio</span>
            </button>

            <button onclick="toggleHistoryModal()" title="Histórico de Navegação" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-indigo-400 transition text-sm">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button onclick="toggleSidebar()" id="sidebar-toggle-btn" title="Alternar Assistente IA Copilot" class="p-1.5 px-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 transition">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                <span class="hidden sm:inline">IA Copilot</span>
            </button>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Web Views Host -->
        <main id="views-container" class="flex-1 bg-slate-950 relative overflow-hidden">
            <!-- Active Tab Views and Iframe Renderers Mounted Dynamically -->
        </main>

        <aside id="ai-sidebar" class="w-80 md:w-96 glass-panel border-l border-slate-800 flex flex-col transition-all duration-300 transform translate-x-0 z-20 shadow-2xl">
            <!-- Sidebar Header -->
            <div class="p-3 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/80">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-brain text-xs"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
                            Gemini AI Copilot
                            <span class="text-[9px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.2 rounded border border-indigo-500/30">Live</span>
                        </h3>
                        <p class="text-[10px] text-slate-400">Navegação Assistida & Resumos</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Context Quick Actions -->
            <div class="p-2 border-b border-slate-800/60 bg-slate-900/40 flex gap-1 overflow-x-auto text-[11px]">
                <button onclick="aiQuickAction('resumir')" class="px-2.5 py-1 rounded-md bg-indigo-950/80 border border-indigo-800/60 text-indigo-200 hover:bg-indigo-900 transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-compress text-indigo-400"></i> Resumir
                </button>
                <button onclick="aiQuickAction('explicar')" class="px-2.5 py-1 rounded-md bg-purple-950/80 border border-purple-800/60 text-purple-200 hover:bg-purple-900 transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-lightbulb text-purple-400"></i> Explicar
                </button>
                <button onclick="aiQuickAction('traduzir')" class="px-2.5 py-1 rounded-md bg-emerald-950/80 border border-emerald-800/60 text-emerald-200 hover:bg-emerald-900 transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-language text-emerald-400"></i> Traduzir
                </button>
            </div>

            <!-- Chat Messages Log -->
            <div id="ai-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs">
                <div class="flex items-start space-x-2">
                    <div class="w-6 h-6 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 mt-0.5">
                        <i class="fa-solid fa-robot text-[10px]"></i>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-slate-200 leading-relaxed max-w-[85%] shadow-sm">
                        Olá! O motor <strong>Proxy CORS Anti-Bloqueio</strong> está ativo. Qualquer site como Google, Wikipedia ou GitHub será carregado via desvio seguro de cabeçalho.
                    </div>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="p-3 border-t border-slate-800/80 bg-slate-900/80">
                <form onsubmit="handleAiChatSubmit(event)" class="relative">
                    <textarea id="ai-input" rows="2" 
                              placeholder="Pergunte ao Gemini Copilot..." 
                              onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); handleAiChatSubmit(event); }"
                              class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl p-2.5 pr-10 text-xs text-slate-100 placeholder-slate-500 focus:outline-none resize-none"></textarea>
                    <button type="submit" class="absolute right-2 bottom-2.5 w-7 h-7 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg flex items-center justify-center transition shadow-md">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </aside>
    </div>

    <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl border border-slate-800 p-5 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
                <h3 class="text-sm font-bold flex items-center gap-2 text-indigo-300">
                    <i class="fa-solid fa-clock-rotate-left"></i> Histórico de Navegação
                </h3>
                <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs">
                <!-- History list items -->
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                <button onclick="clearHistory()" class="text-rose-400 hover:text-rose-300 transition flex items-center gap-1">
                    <i class="fa-solid fa-trash"></i> Limpar Histórico
                </button>
                <button onclick="toggleHistoryModal()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 0;
        let isProxyGlobalEnabled = true; // Default to Proxy Anti-Blocking Enabled

        let historyStore = JSON.parse(localStorage.getItem('apex_history') || '[]');
        let bookmarksStore = JSON.parse(localStorage.getItem('apex_bookmarks') || JSON.stringify([
            { title: 'Google', url: 'https://www.google.com', icon: 'fa-brands fa-google' },
            { title: 'Wikipedia', url: 'https://pt.wikipedia.org', icon: 'fa-solid fa-book' },
            { title: 'DuckDuckGo', url: 'https://duckduckgo.com', icon: 'fa-solid fa-shield-halved' },
            { title: 'GitHub', url: 'https://github.com', icon: 'fa-brands fa-github' },
            { title: 'Notícias (G1)', url: 'https://g1.globo.com', icon: 'fa-solid fa-newspaper' },
            { title: 'StackOverflow', url: 'https://stackoverflow.com', icon: 'fa-brands fa-stack-overflow' }
        ]));

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(simulateRamUsage, 4000);

            // Create initial default new tab
            createNewTab();

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key.toLowerCase() === 't') {
                    e.preventDefault();
                    createNewTab();
                }
                if (e.ctrlKey && e.key.toLowerCase() === 'w') {
                    e.preventDefault();
                    if (activeTabId) closeTab(activeTabId);
                }
                if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                    e.preventDefault();
                    const input = document.getElementById('address-input');
                    input.focus();
                    input.select();
                }
            });
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString('pt-BR');
        }

        function simulateRamUsage() {
            const baseRam = 110 + (tabs.length * 38);
            const variation = Math.floor(Math.random() * 12) - 6;
            document.getElementById('ram-indicator').innerText = `${baseRam + variation} MB RAM`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-xl text-xs flex items-center space-x-2 border transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'error' ? 'bg-rose-950 border-rose-800 text-rose-200' :
                type === 'success' ? 'bg-emerald-950 border-emerald-800 text-emerald-200' :
                'bg-indigo-950 border-indigo-800 text-indigo-200'
            }`;
            
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function createNewTab(url = 'about:newtab', customTitle = null) {
            tabCounter++;
            const tabId = `tab-${tabCounter}`;
            const isNewTab = url === 'about:newtab';
            
            const newTab = {
                id: tabId,
                title: customTitle || (isNewTab ? 'Nova Aba' : extractDomain(url)),
                url: url,
                historyStack: [url],
                historyIndex: 0,
                useProxy: isProxyGlobalEnabled,
                favicon: isNewTab ? 'fa-solid fa-compass' : 'fa-solid fa-globe'
            };

            tabs.push(newTab);
            renderTabsNav();
            switchTab(tabId);

            if (!isNewTab) {
                addToHistory(newTab.title, url);
            }
        }

        function closeTab(tabId, event) {
            if (event) event.stopPropagation();
            if (tabs.length === 1) {
                tabs = [];
                renderTabsNav();
                createNewTab();
                return;
            }

            const index = tabs.findIndex(t => t.id === tabId);
            tabs = tabs.filter(t => t.id !== tabId);

            const viewEl = document.getElementById(`view-${tabId}`);
            if (viewEl) viewEl.remove();

            if (activeTabId === tabId) {
                const nextTab = tabs[Math.max(0, index - 1)];
                switchTab(nextTab.id);
            } else {
                renderTabsNav();
            }
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            const currentTab = tabs.find(t => t.id === tabId);
            if (!currentTab) return;

            renderTabsNav();
            renderActiveTabContent(currentTab);
            updateAddressBarInput(currentTab.url);
            updateBookmarkStarState(currentTab.url);
        }

        function renderTabsNav() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';

            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabBtn = document.createElement('div');
                tabBtn.className = `group relative flex items-center space-x-2 px-3 py-1.5 rounded-t-xl text-xs font-medium cursor-pointer transition-all min-w-[130px] max-w-[200px] border-r border-slate-800/50 ${
                    isActive ? 'tab-active' : 'tab-inactive'
                }`;
                tabBtn.onclick = () => switchTab(tab.id);

                tabBtn.innerHTML = `
                    <i class="${tab.favicon} text-[11px] ${isActive ? 'text-indigo-400' : 'text-slate-500'}"></i>
                    <span class="truncate flex-1">${escapeHtml(tab.title)}</span>
                    <button onclick="closeTab('${tab.id}', event)" class="opacity-0 group-hover:opacity-100 p-0.5 hover:bg-slate-700/60 rounded-full transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-[10px] w-3 h-3 flex items-center justify-center"></i>
                    </button>
                `;

                container.appendChild(tabBtn);
            });
        }

        function updateAddressBarInput(url) {
            const addressInput = document.getElementById('address-input');
            if (url === 'about:newtab') {
                addressInput.value = '';
                addressInput.placeholder = 'Pesquise no Google, Gemini IA ou digite uma URL...';
            } else {
                addressInput.value = url;
            }
        }

        function handleAddressBarKeydown(event) {
            if (event.key === 'Enter') {
                const inputVal = event.target.value.trim();
                if (!inputVal) return;

                const selectedEngine = document.getElementById('search-engine-select').value;
                navigateUrlOrSearch(inputVal, selectedEngine);
            }
        }

        function navigateUrlOrSearch(query, engine = 'google') {
            if (!activeTabId) return;
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;

            let targetUrl = '';
            const isUrlPattern = /^https?:\/\//i.test(query) || (query.includes('.') && !query.includes(' '));

            if (isUrlPattern) {
                targetUrl = query.startsWith('http') ? query : `https://${query}`;
                currentTab.title = extractDomain(targetUrl);
            } else {
                if (engine === 'gemini') {
                    targetUrl = `apex://ai-search?q=${encodeURIComponent(query)}`;
                    currentTab.title = `IA: ${query}`;
                } else if (engine === 'duckduckgo') {
                    targetUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
                    currentTab.title = `DuckDuckGo: ${query}`;
                } else if (engine === 'wikipedia') {
                    targetUrl = `https://pt.wikipedia.org/w/index.php?search=${encodeURIComponent(query)}`;
                    currentTab.title = `Wiki: ${query}`;
                } else {
                    // Google Default
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    currentTab.title = `Google: ${query}`;
                }
            }

            currentTab.url = targetUrl;
            currentTab.historyStack.push(targetUrl);
            currentTab.historyIndex = currentTab.historyStack.length - 1;

            addToHistory(currentTab.title, targetUrl);
            renderTabsNav();
            renderActiveTabContent(currentTab);
            updateAddressBarInput(targetUrl);
            updateBookmarkStarState(targetUrl);
        }

        function renderActiveTabContent(tab) {
            const container = document.getElementById('views-container');
            document.querySelectorAll('.tab-view-body').forEach(el => el.classList.add('hidden'));

            let viewEl = document.getElementById(`view-${tab.id}`);
            if (!viewEl) {
                viewEl = document.createElement('div');
                viewEl.id = `view-${tab.id}`;
                viewEl.className = 'tab-view-body w-full h-full relative';
                container.appendChild(viewEl);
            } else {
                viewEl.classList.remove('hidden');
            }

            if (tab.url === 'about:newtab') {
                renderNewTabDashboard(viewEl);
                return;
            }

            if (tab.url.startsWith('apex://ai-search')) {
                const urlParams = new URLSearchParams(tab.url.split('?')[1]);
                const query = urlParams.get('q') || '';
                renderAiSearchResultView(viewEl, query);
                return;
            }

            // Decide between Proxy Bypass or Direct Iframe
            if (tab.useProxy || isProxyGlobalEnabled) {
                renderProxiedView(viewEl, tab.url);
            } else {
                renderDirectIframeView(viewEl, tab.url);
            }
        }

        async function renderProxiedView(container, url) {
            container.innerHTML = `
                <div class="w-full h-full relative bg-slate-950 flex flex-col items-center justify-center">
                    <div id="proxy-loading-indicator" class="flex flex-col items-center space-y-3 p-6 glass-panel rounded-2xl border border-slate-800 z-10">
                        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                        <div class="text-center">
                            <h4 class="text-xs font-bold text-slate-200">Carregando via Anti-Bloqueio CORS Proxy...</h4>
                            <p class="text-[11px] text-slate-400 font-mono mt-1">${escapeHtml(url)}</p>
                        </div>
                    </div>
                    <iframe id="iframe-proxied-${activeTabId}" class="w-full h-full border-none absolute inset-0 bg-white hidden" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
                </div>
            `;

            const iframe = container.querySelector(`#iframe-proxied-${activeTabId}`);
            const loader = container.querySelector('#proxy-loading-indicator');

            try {
                // Fetch site HTML using CorsProxy or AllOrigins
                const proxyEndpoints = [
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    `https://corsproxy.io/?${encodeURIComponent(url)}`
                ];

                let htmlContent = null;

                for (const endpoint of proxyEndpoints) {
                    try {
                        const res = await fetch(endpoint);
                        if (res.ok) {
                            htmlContent = await res.text();
                            if (htmlContent) break;
                        }
                    } catch (err) {
                        console.warn('Proxy endpoint error:', endpoint, err);
                    }
                }

                if (htmlContent) {
                    // Inject <base href="..."> into head so scripts, images, and links resolve target domain relative URLs
                    const urlObj = new URL(url);
                    const baseUrl = urlObj.origin + urlObj.pathname;
                    const baseTag = `<base href="${baseUrl}">`;

                    if (htmlContent.includes('<head>')) {
                        htmlContent = htmlContent.replace('<head>', `<head>${baseTag}`);
                    } else if (htmlContent.includes('<HEAD>')) {
                        htmlContent = htmlContent.replace('<HEAD>', `<HEAD>${baseTag}`);
                    } else {
                        htmlContent = `${baseTag}${htmlContent}`;
                    }

                    iframe.srcdoc = htmlContent;
                    loader.classList.add('hidden');
                    iframe.classList.remove('hidden');
                } else {
                    throw new Error('Não foi possível obter a página via proxy.');
                }
            } catch (error) {
                // Fallback to error card with choices
                renderProxyErrorFallback(container, url, error.message);
            }
        }

        async function renderAiSearchResultView(container, query) {
            container.innerHTML = `

                    <div class="max-w-3xl w-full">

                                <i class="fa-solid fa-brain"></i>

            try {

                    outputEl.innerHTML = formatMarkdownText(responseText);

            } catch (err) {
                const outputEl = document.getElementById('ai-search-output');

        async function callGeminiApi(promptText, useSearch = false) {
            const apiKey = ""; // API key is runtime injected by environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                systemInstruction: {
                    parts: [{ text: "Você é o assistente virtual do ApexSmart Browser. Responda com clareza em Português do Brasil." }]
                }
            };

            if (useSearch) {
                payload.tools = [{ "google_search": {} }];
            }

            let retries = 0;
            const maxRetries = 3;

            while (retries < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    } else {
                        throw new Error("Formato de resposta inválido.");
                    }
                } catch (err) {
                    retries++;
                    if (retries >= maxRetries) throw err;
                    await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                }
            }
        }

        async function handleAiChatSubmit(e) {
            if (e) e.preventDefault();
            const inputEl = document.getElementById('ai-input');
            const message = inputEl.value.trim();
            if (!message) return;

            inputEl.value = '';
            appendAiChatMessage('user', message);
            const loadingId = appendAiChatMessage('ai', '<i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i> Pensando...');

            try {
                const response = await callGeminiApi(message, true);
                updateAiChatMessage(loadingId, response);
            } catch (err) {
                updateAiChatMessage(loadingId, `Erro: ${err.message}`);
            }
        }

        function appendAiChatMessage(sender, text) {
            const messagesContainer = document.getElementById('ai-messages');
            const msgId = `msg-${Date.now()}`;
            const isUser = sender === 'user';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start space-x-2 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            msgDiv.id = msgId;

            msgDiv.innerHTML = `
                <div class="w-6 h-6 rounded-full ${isUser ? 'bg-indigo-500' : 'bg-indigo-600'} flex items-center justify-center text-white shrink-0 mt-0.5">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-[10px]"></i>
                </div>
                <div class="${isUser ? 'bg-indigo-600/90 text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'} rounded-xl p-3 leading-relaxed max-w-[85%] shadow-sm text-xs">
                    ${formatMarkdownText(text)}
                </div>
            `;

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msgId;
        }

        function updateAiChatMessage(msgId, newText) {
            const msgDiv = document.getElementById(msgId);
            if (msgDiv) {
                const bubble = msgDiv.querySelector('div:nth-child(2)');
                if (bubble) bubble.innerHTML = formatMarkdownText(newText);
            }
        }

        function aiQuickAction(action) {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;

            if (action === 'resumir') {
                const prompt = `Resuma o site ou busca atual: ${currentTab.url}`;
                document.getElementById('ai-input').value = prompt;
                handleAiChatSubmit();
            } else if (action === 'explicar') {
                const prompt = `Explique o tema principal deste site: ${currentTab.url}`;
                document.getElementById('ai-input').value = prompt;
                handleAiChatSubmit();
            } else if (action === 'traduzir') {
                const prompt = `Traduza para o português as informações de: ${currentTab.url}`;
                document.getElementById('ai-input').value = prompt;
                handleAiChatSubmit();
            }
        }

        function toggleProxyGlobalMode() {
            isProxyGlobalEnabled = !isProxyGlobalEnabled;
            const statusTag = document.getElementById('proxy-status-tag');
            const badgeText = document.getElementById('badge-proxy-text');
            const btn = document.getElementById('proxy-toggle-btn');

            if (isProxyGlobalEnabled) {
                statusTag.innerText = 'Proxy CORS: Ativo';
                statusTag.className = 'text-emerald-400 font-semibold';
                badgeText.innerText = 'Proxy Bypass ON';
                btn.className = 'px-2.5 py-1.5 rounded-lg bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-600/30 font-medium text-xs flex items-center gap-1.5 transition';
                showToast('Modo Anti-Bloqueio (CORS Proxy) ATIVADO', 'success');
            } else {
                statusTag.innerText = 'Proxy CORS: Desativado';
                statusTag.className = 'text-slate-400 font-semibold';
                badgeText.innerText = 'Modo Direto';
                btn.className = 'px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 font-medium text-xs flex items-center gap-1.5 transition';
                showToast('Modo Direto (Iframe) ATIVADO - Podem ocorrer bloqueios de frame', 'info');
            }

            // Reload current active tab with new mode
            reloadActiveTab();
        }

        function toggleBookmarkCurrent() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab || currentTab.url === 'about:newtab') return;

            const existingIndex = bookmarksStore.findIndex(b => b.url === currentTab.url);
            if (existingIndex >= 0) {
                bookmarksStore.splice(existingIndex, 1);
                showToast('Removido dos favoritos');
            } else {
                bookmarksStore.push({
                    title: currentTab.title,
                    url: currentTab.url,
                    icon: 'fa-solid fa-globe'
                });
                showToast('Adicionado aos favoritos!', 'success');
            }

            localStorage.setItem('apex_bookmarks', JSON.stringify(bookmarksStore));
            updateBookmarkStarState(currentTab.url);
        }

        function updateBookmarkStarState(url) {
            const starBtn = document.getElementById('star-bookmark-btn');
            if (!starBtn) return;
            const isBookmarked = bookmarksStore.some(b => b.url === url);
            starBtn.innerHTML = isBookmarked ? '<i class="fa-solid fa-star text-amber-400"></i>' : '<i class="fa-regular fa-star"></i>';
        }

        function addToHistory(title, url) {
            if (url === 'about:newtab') return;
            historyStore.unshift({ title, url, time: new Date().toLocaleTimeString('pt-BR') });
            if (historyStore.length > 50) historyStore.pop();
            localStorage.setItem('apex_history', JSON.stringify(historyStore));
        }

        function toggleHistoryModal() {
            const modal = document.getElementById('history-modal');
            const listEl = document.getElementById('history-list');

            if (modal.classList.contains('hidden')) {
                listEl.innerHTML = historyStore.length === 0 ? '<p class="text-slate-500 py-4 text-center">Nenhum histórico registrado.</p>' : '';
                historyStore.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'p-2 rounded-lg bg-slate-900 hover:bg-slate-800 transition flex items-center justify-between cursor-pointer border border-slate-800';
                    row.onclick = () => {
                        toggleHistoryModal();
                        navigateUrlOrSearch(item.url);
                    };
                    row.innerHTML = `
                        <div class="truncate mr-2">
                            <p class="font-medium text-slate-200 truncate">${escapeHtml(item.title)}</p>
                            <p class="text-[10px] text-slate-500 truncate">${escapeHtml(item.url)}</p>
                        </div>
                        <span class="text-[10px] font-mono text-slate-500 shrink-0">${item.time}</span>
                    `;
                    listEl.appendChild(row);
                });

                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function clearHistory() {
            historyStore = [];
            localStorage.removeItem('apex_history');
            toggleHistoryModal();
            showToast('Histórico limpo');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('ai-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function navigateActiveTab(direction) {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;

            if (direction === 'back' && currentTab.historyIndex > 0) {
                currentTab.historyIndex--;
                currentTab.url = currentTab.historyStack[currentTab.historyIndex];
                renderActiveTabContent(currentTab);
                updateAddressBarInput(currentTab.url);
            } else if (direction === 'forward' && currentTab.historyIndex < currentTab.historyStack.length - 1) {
                currentTab.historyIndex++;
                currentTab.url = currentTab.historyStack[currentTab.historyIndex];
                renderActiveTabContent(currentTab);
                updateAddressBarInput(currentTab.url);
            }
        }

        function reloadActiveTab() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) {
                const icon = document.getElementById('reload-icon');
                icon.classList.add('fa-spin');
                renderActiveTabContent(currentTab);
                setTimeout(() => icon.classList.remove('fa-spin'), 600);
            }
        }

        function goHome() {
            if (activeTabId) {
                const currentTab = tabs.find(t => t.id === activeTabId);
                if (currentTab) {
                    currentTab.url = 'about:newtab';
                    currentTab.title = 'Nova Aba';
                    renderTabsNav();
                    renderActiveTabContent(currentTab);
                    updateAddressBarInput('about:newtab');
                }
            }
        }

        function extractDomain(url) {
            try {
                const parsed = new URL(url.startsWith('http') ? url : `https://${url}`);
                return parsed.hostname.replace('www.', '');
            } catch (e) {
                return url;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function formatMarkdownText(text) {
            if (!text) return '';
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code class="bg-slate-950 px-1 py-0.5 rounded text-indigo-300 font-mono text-[11px]">$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }
