<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoNexus Maps - Gratuito</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome para Ícones Vetoriais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-main: #202124;
            --text-muted: #5f6368;
            --accent: #1a73e8;
            --accent-hover: #1557b0;
            --border: #dadce0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        aside {
            width: 400px;
            height: 100%;
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo-area i {
            font-size: 24px;
            color: var(--accent);
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
        }

        .tools-section {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.8px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: #e8f0fe;
            border-color: var(--accent);
            color: var(--accent);
        }

        .category-btn i {
            color: var(--accent);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            z-index: 1;
        }

        /* Marcador Vetorial com FontAwesome */
        .vector-marker {
            background: transparent;
            border: none;
        }

        .marker-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @media(max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            aside {
                width: 100%;
                height: 45vh;
            }
            #map {
                height: 55vh;
            }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="logo-area">
                <i class="fa-solid fa-earth-americas"></i>
                <h1>GeoNexus Free</h1>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Pesquisar local...">
            </div>
        </div>

        <div class="tools-section">
            <p class="section-title">Explorar Capitais</p>
            <div class="category-grid">
                <button class="category-btn" onclick="moveTo(-23.5505, -46.6333, 13)">
                    <i class="fa-solid fa-city"></i> São Paulo
                </button>
                <button class="category-btn" onclick="moveTo(-22.9068, -43.1729, 13)">
                    <i class="fa-solid fa-umbrella-beach"></i> Rio
                </button>
                <button class="category-btn" onclick="moveTo(-25.4284, -49.2733, 13)">
                    <i class="fa-solid fa-tree-city"></i> Curitiba
                </button>
                <button class="category-btn" onclick="moveTo(-15.7801, -47.9292, 13)">
                    <i class="fa-solid fa-landmark"></i> Brasília
                </button>
            </div>
        </div>
    </aside>

    <main id="map"></main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicialização do mapa gratuito (OpenStreetMap)
        const map = L.map('map').setView([-23.5505, -46.6333], 13);

        // Camada de tiles gratuita do OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Criando um ícone vetorial personalizado com FontAwesome
        const vectorIcon = L.divIcon({
            className: 'vector-marker',
            html: '<div class="marker-icon"><i class="fa-solid fa-star"></i></div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        // Adicionando marcador no mapa
        L.marker([-23.5505, -46.6333], { icon: vectorIcon })
            .addTo(map)
            .bindPopup('<b>Marco Zero</b><br>São Paulo - SP');

        // Função de navegação rápida
        function moveTo(lat, lng, zoom) {
            map.flyTo([lat, lng], zoom, {
                duration: 2
            });
        }
    </script>
</body>
</html>
