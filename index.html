<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PoleMaps</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
        body { font-family: 'Roboto', sans-serif; overflow: hidden; user-select: none; position: fixed; inset: 0; perspective: 1200px; }
        
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
        .leaflet-routing-container { display: none !important; }

        #map-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        #map {
            width: 250vw;
            height: 250vw;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(45deg);
            transform-origin: center center;
            transition: transform 0.1s linear;
        }

        .leaflet-tile-pane { filter: contrast(1.05) saturate(0.85); }

        .user-gps-container {
            position: relative;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-pulse {
            width: 80px; height: 80px;
            background: rgba(37, 99, 235, 0.4);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s infinite;
        }

        .user-dot {
            width: 36px; height: 36px;
            background: #2563eb;
            border: 5px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        .panel-slide { transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
    </style>
</head>
<body id="app-body" class="h-full w-full flex flex-col relative bg-zinc-100 text-zinc-900 overflow-hidden box-border">

    <!-- MAPA -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- MODAL DE CHEGADA -->
    <div id="arrivalModal" class="absolute inset-0 bg-black/75 z-50 hidden flex flex-col items-center justify-center p-6 backdrop-blur-xs box-border">
        <div class="bg-white border border-zinc-200 rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl flex flex-col items-center text-zinc-900">
            <div class="w-20 h-20 bg-emerald-600 text-white rounded-full flex items-center justify-center text-4xl mb-4 shadow-lg animate-bounce">
                <i class="fa-solid fa-flag-checkered"></i>
            </div>
            <h2 class="text-3xl font-extrabold mb-2">Você chegou!</h2>
            <p class="text-zinc-600 text-base mb-8">Destino alcançado com sucesso pelo PoleMaps.</p>
            <button onclick="closeArrivalModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 text-lg rounded-2xl shadow-xl transition">
                Finalizar Navegação
            </button>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="view-home" class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none p-4 box-border">
        <div class="pointer-events-auto flex items-center space-x-3 mt-2 w-full">
            <div id="search-bar-container" class="flex-1 bg-white shadow-2xl rounded-full flex items-center px-5 py-3.5 border border-zinc-200 box-border text-zinc-900">
                <button onclick="clearSearch()" class="text-zinc-500 mr-3 text-2xl hover:text-zinc-900 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <input type="text" id="searchInput" placeholder="Pesquisar rua ou local (ou histórico)..." oninput="handleSearchInput(event)" onfocus="showHistorySuggestions()"
                       class="flex-1 bg-transparent text-inherit placeholder:text-zinc-400 focus:outline-none text-lg font-medium min-w-0">
                <button class="text-zinc-500 mx-3 text-xl hover:text-zinc-900 transition">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm text-white shadow shrink-0">US</div>
            </div>
        </div>

        <div id="suggestionsBox" class="absolute left-4 right-20 top-20 bg-white border border-zinc-200 rounded-3xl shadow-2xl hidden max-h-72 overflow-y-auto z-30 pointer-events-auto box-border text-zinc-900"></div>

        <div class="pointer-events-auto flex justify-end space-x-3 px-2 mb-28">
            <button onclick="toggleTheme()" id="themeToggleBtnHome" class="w-14 h-14 bg-white text-orange-500 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-200 active:scale-95 transition" title="Alternar Tema">
                <i class="fa-solid fa-sun" id="themeIconHome"></i>
            </button>
            <button onclick="centerOnUser()" id="centerBtn" class="w-14 h-14 bg-white text-blue-600 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-200 active:scale-95 transition" title="Centralizar">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </div>
    </div>

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="absolute inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center backdrop-blur-xs box-border">
        <div class="w-14 h-14 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-white font-semibold text-base tracking-wide">Calculando atalhos e rota livre...</p>
    </div>

    <!-- TELA 2: FICHA DO LOCAL -->
    <div id="view-place-sheet" class="absolute inset-x-0 bottom-4 z-20 mx-3 bg-white rounded-3xl shadow-2xl p-5 border border-zinc-200 panel-slide translate-y-[120%] flex flex-col max-h-[80vh] box-border text-zinc-900">
        <div id="sheet-handle" class="w-14 h-2 bg-zinc-300 rounded-full mx-auto mb-4"></div>
        
        <div class="flex justify-between items-start mb-2">
            <div>
                <h2 id="sheet-title" class="text-2xl font-bold">Local Selecionado</h2>
            </div>
            <button onclick="closeSheet()" id="sheet-close-btn" class="w-10 h-10 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 text-lg shrink-0">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <p class="text-sm text-zinc-500 mb-4">PoleMaps • Navegação 3D Offline Ready</p>

        <div id="vehicle-container" class="grid grid-cols-1 gap-2 mb-5 bg-zinc-100 p-3 rounded-2xl border border-zinc-200 box-border">
            <div class="flex items-center justify-between px-4 py-3 rounded-xl bg-blue-600 text-white">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-bicycle text-2xl"></i>
                    <span class="text-base font-semibold">Bike (Caminho Direto e Livre)</span>
                </div>
                <span class="text-lg font-extrabold" id="timeBike">--</span>
            </div>
        </div>

        <button onclick="startNavigation()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 px-4 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-xl transition">
            <i class="fa-solid fa-location-arrow text-xl"></i>
            <span>Iniciar Navegação</span>
        </button>
    </div>

    <!-- TELA 3: NAVEGAÇÃO EM ANDAMENTO (SEM PAINEL SUPERIOR) -->
    <div id="view-navigation" class="absolute inset-0 z-30 pointer-events-none flex flex-col justify-end p-4 box-border hidden">
        <!-- PAINEL INFERIOR COM BOTÃO DE REORGANIZAR ROTA ACIMA -->
        <div class="flex flex-col space-y-3 w-full">
            <div id="reorganize-container" class="pointer-events-auto flex justify-center w-full hidden">
                <button onclick="reorganizeRoute()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-base px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 border border-amber-500 transition animate-bounce">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span>Reorganizar Rota</span>
                </button>
            </div>

            <div id="nav-bottom-panel" class="pointer-events-auto bg-white border border-zinc-200 rounded-3xl p-4 flex items-center justify-between shadow-2xl box-border w-full text-zinc-900">
                <button onclick="cancelNavigation()" id="nav-cancel-btn" class="w-14 h-14 rounded-full bg-zinc-100 flex items-center justify-center text-red-500 text-2xl border border-zinc-200 shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="text-center px-2">
                    <div id="nav-time" class="text-3xl font-black">-- min</div>
                    <div id="nav-distance" class="text-sm text-zinc-500 font-semibold">-- km</div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleTheme()" id="themeToggleBtnNav" class="w-14 h-14 bg-zinc-100 text-orange-500 rounded-2xl flex items-center justify-center text-xl border border-zinc-200 shrink-0 active:scale-95 transition" title="Alternar Tema">
                        <i class="fa-solid fa-sun" id="themeIconNav"></i>
                    </button>
                    <div id="nav-speed-box" class="w-20 h-14 rounded-2xl bg-zinc-100 flex flex-col items-center justify-center border border-zinc-200 text-blue-600 shrink-0">
                        <span id="current-speed" class="text-xl font-black">0</span>
                        <span class="text-[10px] text-zinc-500 uppercase tracking-tighter font-bold">km/h</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let tileLayer;
        let userLatLng = null;
        let userMarker = null;
        let destinationLatLng = null;
        let destinationMarker = null;
        let routingControl = null;
        let isFollowingUser = true;
        let searchTimeout = null;
        let currentTheme = 'light';
        let isNavigating = false;
        let currentHeading = 0;
        let routeCoordinates = [];
        let navigationInterval = null;
        let traveledLine = null;
        let remainingLine = null;
        let hasArrived = false;

        const NAVIGATION_ZOOM = 19;

        function initMap() {
            userLatLng = L.latLng(-23.5505, -46.6333);
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userLatLng, NAVIGATION_ZOOM);
            setMapTheme(currentTheme);

            updateUserMarker(userLatLng);
            startRealGeolocation();
            initCompassSensor();

            map.on('click', function(e) {
                if (isNavigating) return;
                selectLocation(e.latlng, "Local Selecionado");
            });

            map.on('dragstart', function() {
                isFollowingUser = false;
            });
        }

        function initCompassSensor() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    let heading = event.alpha;
                    if (heading !== null) {
                        if (event.webkitCompassHeading !== undefined) {
                            heading = event.webkitCompassHeading;
                        }
                        currentHeading = heading;
                        if (userLatLng && isFollowingUser) {
                            applyMapTransform(currentHeading);
                        }
                    }
                }, true);
            }
        }

        function applyMapTransform(heading) {
            const mapElement = document.getElementById('map');
            if (mapElement) {
                mapElement.style.transform = `translate(-50%, -50%) rotateX(45deg) rotate(${-heading}deg)`;
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setMapTheme(currentTheme);
            applyUITheme(currentTheme);
        }

        function setMapTheme(theme) {
            if (tileLayer) map.removeLayer(tileLayer);
            if (theme === 'dark') {
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 21 });
            } else {
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 21 });
            }
            tileLayer.addTo(map);
        }

        function applyUITheme(theme) {
            const body = document.getElementById('app-body');
            const searchBar = document.getElementById('search-bar-container');
            const suggestions = document.getElementById('suggestionsBox');
            const themeBtnHome = document.getElementById('themeToggleBtnHome');
            const themeIconHome = document.getElementById('themeIconHome');
            const themeBtnNav = document.getElementById('themeToggleBtnNav');
            const themeIconNav = document.getElementById('themeIconNav');
            const centerBtn = document.getElementById('centerBtn');
            const sheet = document.getElementById('view-place-sheet');
            const sheetHandle = document.getElementById('sheet-handle');
            const sheetClose = document.getElementById('sheet-close-btn');
            const vehicleContainer = document.getElementById('vehicle-container');
            const navBottomPanel = document.getElementById('nav-bottom-panel');
            const navCancelBtn = document.getElementById('nav-cancel-btn');
            const navSpeedBox = document.getElementById('nav-speed-box');

            if (theme === 'light') {
                body.className = "h-full w-full flex flex-col relative bg-zinc-100 text-zinc-900 overflow-hidden box-border";
                searchBar.className = "flex-1 bg-white shadow-2xl rounded-full flex items-center px-5 py-3.5 border border-zinc-200 box-border text-zinc-900";
                suggestions.className = "absolute left-4 right-20 top-20 bg-white border border-zinc-200 rounded-3xl shadow-2xl hidden max-h-72 overflow-y-auto z-30 pointer-events-auto text-zinc-900 box-border";
                themeBtnHome.className = "w-14 h-14 bg-white text-orange-500 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-200 shrink-0 active:scale-95 transition";
                themeIconHome.className = "fa-solid fa-sun";
                themeBtnNav.className = "w-14 h-14 bg-zinc-100 text-orange-500 rounded-2xl flex items-center justify-center text-xl border border-zinc-200 shrink-0 active:scale-95 transition";
                themeIconNav.className = "fa-solid fa-sun";
                centerBtn.className = "w-14 h-14 bg-white text-blue-600 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-200 active:scale-95 transition";
                sheet.className = "absolute inset-x-0 bottom-4 z-20 mx-3 bg-white rounded-3xl shadow-2xl p-5 border border-zinc-200 panel-slide translate-y-[120%] flex flex-col max-h-[80vh] text-zinc-900 box-border";
                sheetHandle.className = "w-14 h-2 bg-zinc-300 rounded-full mx-auto mb-4";
                sheetClose.className = "w-10 h-10 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 text-lg shrink-0";
                vehicleContainer.className = "grid grid-cols-1 gap-2 mb-5 bg-zinc-100 p-3 rounded-2xl border border-zinc-200 box-border";
                navBottomPanel.className = "pointer-events-auto bg-white border border-zinc-200 rounded-3xl p-4 flex items-center justify-between shadow-2xl text-zinc-900 box-border w-full";
                navCancelBtn.className = "w-14 h-14 rounded-full bg-zinc-100 flex items-center justify-center text-red-500 text-2xl border border-zinc-200 shrink-0";
                navSpeedBox.className = "w-20 h-14 rounded-2xl bg-zinc-100 flex flex-col items-center justify-center border border-zinc-200 text-blue-600 shrink-0";
            } else {
                body.className = "h-full w-full flex flex-col relative bg-zinc-900 text-gray-100 overflow-hidden box-border";
                searchBar.className = "flex-1 bg-zinc-800 shadow-2xl rounded-full flex items-center px-5 py-3.5 border border-zinc-700/80 box-border text-gray-100";
                suggestions.className = "absolute left-4 right-20 top-20 bg-zinc-800 border border-zinc-700 rounded-3xl shadow-2xl hidden max-h-72 overflow-y-auto z-30 pointer-events-auto text-gray-100 box-border";
                themeBtnHome.className = "w-14 h-14 bg-zinc-800 text-yellow-400 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-700 shrink-0 active:scale-95 transition";
                themeIconHome.className = "fa-solid fa-moon";
                themeBtnNav.className = "w-14 h-14 bg-zinc-900 text-yellow-400 rounded-2xl flex items-center justify-center text-xl border border-zinc-700 shrink-0 active:scale-95 transition";
                themeIconNav.className = "fa-solid fa-moon";
                centerBtn.className = "w-14 h-14 bg-zinc-800 text-blue-400 shadow-2xl rounded-full flex items-center justify-center text-2xl border border-zinc-700 active:scale-95 transition";
                sheet.className = "absolute inset-x-0 bottom-4 z-20 mx-3 bg-zinc-800 rounded-3xl shadow-2xl p-5 border border-zinc-700 panel-slide translate-y-[120%] flex flex-col max-h-[80vh] text-gray-100 box-border";
                sheetHandle.className = "w-14 h-2 bg-zinc-600 rounded-full mx-auto mb-4";
                sheetClose.className = "w-10 h-10 rounded-full bg-zinc-700 flex items-center justify-center text-zinc-300 hover:text-white text-lg shrink-0";
                vehicleContainer.className = "grid grid-cols-1 gap-2 mb-5 bg-zinc-900 p-3 rounded-2xl border border-zinc-700 box-border";
                navBottomPanel.className = "pointer-events-auto bg-zinc-800 border border-zinc-700 rounded-3xl p-4 flex items-center justify-between shadow-2xl text-gray-100 box-border w-full";
                navCancelBtn.className = "w-14 h-14 rounded-full bg-zinc-700 flex items-center justify-center text-red-400 text-2xl border border-zinc-600 shrink-0";
                navSpeedBox.className = "w-20 h-14 rounded-2xl bg-zinc-900 flex flex-col items-center justify-center border border-zinc-700 text-blue-400 shrink-0";
            }
        }

        function startRealGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const newLat = position.coords.latitude;
                        const newLng = position.coords.longitude;
                        userLatLng = L.latLng(newLat, newLng);

                        updateUserMarker(userLatLng);
                        
                        if (position.coords.speed !== null && position.coords.speed >= 0) {
                            const speedKmH = Math.round(position.coords.speed * 3.6);
                            document.getElementById('current-speed').innerText = speedKmH;
                        }

                        if (isFollowingUser) {
                            map.setView(userLatLng, NAVIGATION_ZOOM, { animate: false });
                            applyMapTransform(currentHeading);
                        }

                        if (isNavigating && routeCoordinates.length > 0) {
                            updateRouteProgress(userLatLng);
                            checkArrival(userLatLng);
                        }
                    },
                    (err) => { console.warn("Aguardando GPS..."); },
                    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
                );
            }
        }

        function updateUserMarker(latlng) {
            const iconHtml = `
                <div class="user-gps-container">
                    <div class="user-pulse"></div>
                    <div class="user-dot"></div>
                </div>`;

            if (!userMarker) {
                const icon = L.divIcon({ className: '', html: iconHtml, iconSize: [72, 72], iconAnchor: [36, 36] });
                userMarker = L.marker(latlng, { icon: icon, zIndexOffset: 999999 }).addTo(map);
            } else {
                userMarker.setLatLng(latlng);
            }
        }

        function centerOnUser() {
            isFollowingUser = true;
            if (userLatLng) {
                map.setView(userLatLng, NAVIGATION_ZOOM, { animate: true });
                applyMapTransform(currentHeading);
            }
        }

        function saveToHistory(name, lat, lon) {
            let history = JSON.parse(localStorage.getItem('polemaps_history') || '[]');
            history = history.filter(item => item.name !== name);
            history.unshift({ name, lat, lon });
            if (history.length > 10) history.pop();
            localStorage.setItem('polemaps_history', JSON.stringify(history));
        }

        function showHistorySuggestions() {
            const box = document.getElementById('suggestionsBox');
            let history = JSON.parse(localStorage.getItem('polemaps_history') || '[]');
            
            if (history.length > 0) {
                box.innerHTML = `<div class="px-5 py-2 text-xs font-bold text-zinc-400 uppercase tracking-wider">Locais Salvos (Offline Ready)</div>`;
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `px-5 py-3.5 ${currentTheme === 'light' ? 'hover:bg-zinc-100 border-zinc-200' : 'hover:bg-zinc-700 border-zinc-700'} border-b text-base cursor-pointer flex items-center space-x-3`;
                    div.innerHTML = `<i class="fa-solid fa-clock-rotate-left text-blue-500 mr-1"></i><span class="truncate font-medium">${item.name}</span>`;
                    div.onclick = () => {
                        document.getElementById('searchInput').value = item.name;
                        box.classList.add('hidden');
                        selectLocation(L.latLng(item.lat, item.lon), item.name);
                    };
                    box.appendChild(div);
                });
                box.classList.remove('hidden');
            }
        }

        function handleSearchInput(e) {
            const query = e.target.value;
            clearTimeout(searchTimeout);
            const box = document.getElementById('suggestionsBox');

            if (!query || query.length < 3) {
                showHistorySuggestions();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=br&q=${encodeURIComponent(query)}&limit=5`);
                    const data = await res.json();
                    
                    box.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            const fullName = item.display_name.split(',')[0];
                            const div = document.createElement('div');
                            div.className = `px-5 py-4 ${currentTheme === 'light' ? 'hover:bg-zinc-100 border-zinc-200' : 'hover:bg-zinc-700 border-zinc-700'} border-b text-base cursor-pointer flex items-center space-x-3`;
                            div.innerHTML = `<i class="fa-solid fa-location-dot text-blue-500 text-sm mr-1"></i><span class="truncate font-medium">${item.display_name}</span>`;
                            div.onclick = () => {
                                document.getElementById('searchInput').value = fullName;
                                box.classList.add('hidden');
                                saveToHistory(fullName, parseFloat(item.lat), parseFloat(item.lon));
                                selectLocation(L.latLng(parseFloat(item.lat), parseFloat(item.lon)), fullName);
                            };
                            box.appendChild(div);
                        });
                        box.classList.remove('hidden');
                    } else {
                        box.classList.add('hidden');
                    }
                } catch(err) {
                    let history = JSON.parse(localStorage.getItem('polemaps_history') || '[]');
                    let matched = history.filter(h => h.name.toLowerCase().includes(query.toLowerCase()));
                    box.innerHTML = '';
                    if(matched.length > 0) {
                        matched.forEach(item => {
                            const div = document.createElement('div');
                            div.className = `px-5 py-4 border-b text-base cursor-pointer flex items-center space-x-3`;
                            div.innerHTML = `<i class="fa-solid fa-wifi-slash text-orange-500"></i><span class="truncate font-medium">${item.name} (Modo Offline)</span>`;
                            div.onclick = () => {
                                document.getElementById('searchInput').value = item.name;
                                box.classList.add('hidden');
                                selectLocation(L.latLng(item.lat, item.lon), item.name);
                            };
                            box.appendChild(div);
                        });
                        box.classList.remove('hidden');
                    }
                }
            }, 300);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('suggestionsBox').classList.add('hidden');
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (routingControl) map.removeControl(routingControl);
            routingControl = null;
            destinationMarker = null;
            routeCoordinates = [];
            closeSheet();
            centerOnUser();
        }

        function selectLocation(latlng, name) {
            destinationLatLng = latlng;
            document.getElementById('sheet-title').innerText = name;
            
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.circleMarker(latlng, {
                radius: 12, color: '#ffffff', fillColor: '#ea4335', fillOpacity: 1, weight: 3
            }).addTo(map);

            document.getElementById('view-home').classList.add('hidden');
            const sheet = document.getElementById('view-place-sheet');
            sheet.classList.remove('translate-y-[120%]');
            sheet.classList.add('translate-y-0');
            map.setView(latlng, NAVIGATION_ZOOM, { animate: true });
            
            calculateBikeTimeAndRoute();
        }

        function closeSheet() {
            const sheet = document.getElementById('view-place-sheet');
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-[120%]');
            document.getElementById('view-home').classList.remove('hidden');
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (routingControl) map.removeControl(routingControl);
            routingControl = null;
        }

        function formatMinutesToHours(totalMinutes) {
            if (totalMinutes < 60) return `${Math.max(1, totalMinutes)} min`;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = Math.round(totalMinutes % 60);
            return minutes === 0 ? `${hours} h` : `${hours} h ${minutes} min`;
        }

        async function calculateBikeTimeAndRoute() {
            if (!userLatLng || !destinationLatLng) return;
            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/bike/${userLatLng.lng},${userLatLng.lat};${destinationLatLng.lng},${destinationLatLng.lat}?overview=false&alternatives=false`);
                const data = await res.json();
                if (data && data.routes && data.routes.length > 0) {
                    const summary = data.routes[0];
                    const totalMinutes = Math.round((summary.duration / 60) * 1.8);
                    document.getElementById('timeBike').innerText = formatMinutesToHours(totalMinutes);
                }
            } catch(e) {
                const distMeters = userLatLng.distanceTo(destinationLatLng);
                const estMin = Math.max(1, Math.round((distMeters / 1000) / 12 * 60));
                document.getElementById('timeBike').innerText = formatMinutesToHours(estMin) + " (Offline)";
            }
        }

        function startNavigation() {
            hasArrived = false;
            isNavigating = true;
            isFollowingUser = true;
            closeSheet();
            calculateRoute(() => {
                document.getElementById('view-navigation').classList.remove('hidden');
                if (userLatLng) {
                    map.setView(userLatLng, NAVIGATION_ZOOM, { animate: true });
                    applyMapTransform(currentHeading);
                }
            }, true);

            if (navigationInterval) clearInterval(navigationInterval);
            navigationInterval = setInterval(() => {
                if (isNavigating && userLatLng && isFollowingUser) {
                    map.setView(userLatLng, NAVIGATION_ZOOM, { animate: false });
                    applyMapTransform(currentHeading);
                }
            }, 100);
        }

        function calculateRoute(onComplete, isPreview = false) {
            if (!userLatLng || !destinationLatLng) return;
            if (isPreview) document.getElementById('loadingOverlay').classList.remove('hidden');

            if (routingControl) map.removeControl(routingControl);
            if (traveledLine) map.removeLayer(traveledLine);
            if (remainingLine) map.removeLayer(remainingLine);

            routingControl = L.Routing.control({
                waypoints: [userLatLng, destinationLatLng],
                router: L.Routing.osrmv1({ 
                    serviceUrl: 'https://router.project-osrm.org/route/v1', 
                    profile: 'bike',
                    options: { geometries: 'geojson' }
                }),
                routeWhileDragging: false,
                show: false,
                lineOptions: { styles: [{ color: isPreview ? '#2563eb' : 'transparent', opacity: 0.9, weight: 8 }] },
                fitSelectedRoutes: isPreview
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                if (isPreview) document.getElementById('loadingOverlay').classList.add('hidden');
                const routes = e.routes;
                if (routes && routes.length > 0) {
                    routeCoordinates = routes[0].coordinates;
                    if (isNavigating) {
                        updateRouteProgress(userLatLng);
                    }
                }
                if (onComplete) onComplete();
            });

            routingControl.on('routingerror', function(e) {
                if (isPreview) document.getElementById('loadingOverlay').classList.add('hidden');
                routeCoordinates = [
                    { lat: userLatLng.lat, lng: userLatLng.lng },
                    { lat: destinationLatLng.lat, lng: destinationLatLng.lng }
                ];
                if (isNavigating) updateRouteProgress(userLatLng);
                if (onComplete) onComplete();
            });
        }

        function updateRouteProgress(currentLatLng) {
            if (routeCoordinates.length === 0) return;

            let closestIndex = 0;
            let minDistance = Infinity;

            for (let i = 0; i < routeCoordinates.length; i++) {
                const pt = routeCoordinates[i];
                const dist = Math.hypot(pt.lat - currentLatLng.lat, pt.lng - currentLatLng.lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIndex = i;
                }
            }

            let remainingDistanceMeters = 0;
            for (let i = closestIndex; i < routeCoordinates.length - 1; i++) {
                const p1 = routeCoordinates[i];
                const p2 = routeCoordinates[i+1];
                remainingDistanceMeters += L.latLng(p1.lat, p1.lng).distanceTo(L.latLng(p2.lat, p2.lng));
            }

            const totalKm = (remainingDistanceMeters / 1000).toFixed(1);
            const remainingMinutes = Math.max(1, Math.round((remainingDistanceMeters / 1000) / 12 * 60));

            document.getElementById('nav-time').innerText = formatMinutesToHours(remainingMinutes);
            document.getElementById('nav-distance').innerText = `${totalKm} km`;

            const distanceMeters = minDistance * 111320;
            const reorganizeContainer = document.getElementById('reorganize-container');
            if (distanceMeters > 30) {
                reorganizeContainer.classList.remove('hidden');
            } else {
                reorganizeContainer.classList.add('hidden');
            }

            const traveledCoords = routeCoordinates.slice(0, closestIndex + 1);
            const remainingCoords = routeCoordinates.slice(closestIndex);

            if (traveledLine) map.removeLayer(traveledLine);
            if (remainingLine) map.removeLayer(remainingLine);

            traveledLine = L.polyline(traveledCoords, { color: '#a1a1aa', weight: 8, opacity: 0.8 }).addTo(map);
            remainingLine = L.polyline(remainingCoords, { color: '#2563eb', weight: 9, opacity: 0.95 }).addTo(map);
        }

        function checkArrival(currentLatLng) {
            if (hasArrived || !destinationLatLng) return;
            const distanceToDestination = currentLatLng.distanceTo(destinationLatLng);
            if (distanceToDestination <= 20) {
                hasArrived = true;
                document.getElementById('arrivalModal').classList.remove('hidden');
            }
        }

        function closeArrivalModal() {
            document.getElementById('arrivalModal').classList.add('hidden');
            cancelNavigation();
        }

        function reorganizeRoute() {
            if (!userLatLng || !destinationLatLng) return;
            calculateRoute(() => {
                document.getElementById('reorganize-container').classList.add('hidden');
                centerOnUser();
            }, false);
        }

        function cancelNavigation() {
            isNavigating = false;
            isFollowingUser = true;
            hasArrived = false;
            if (navigationInterval) {
                clearInterval(navigationInterval);
                navigationInterval = null;
            }
            applyMapTransform(0);
            document.getElementById('view-navigation').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('reorganize-container').classList.add('hidden');
            document.getElementById('arrivalModal').classList.add('hidden');
            
            if (routingControl) map.removeControl(routingControl);
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (traveledLine) map.removeLayer(traveledLine);
            if (remainingLine) map.removeLayer(remainingLine);
            
            routingControl = null;
            destinationMarker = null;
            traveledLine = null;
            remainingLine = null;
            routeCoordinates = [];
            
            centerOnUser();
        }

        window.onload = initMap;
    </script>
</body>
</html>
