<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#080b10;

    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #172331 0%,
            #080b10 65%
        );

    color:white;

    text-align:center;
}

#loading h1{
    font-size:30px;
    letter-spacing:2px;
    margin-bottom:12px;
}

#loadingText{
    font-size:14px;
    opacity:.7;
}

#progress{
    width:250px;
    height:7px;

    margin-top:20px;

    border-radius:20px;

    background:#252a30;

    overflow:hidden;
}

#progressBar{
    width:0%;
    height:100%;

    background:#4d8dff;

    transition:.25s;
}

#errorBox{
    display:none;

    width:90%;
    max-width:420px;

    margin-top:25px;

    padding:15px;

    background:#351414;

    border:1px solid #8e3838;

    border-radius:12px;

    color:#ffb5b5;

    font-size:13px;

    line-height:1.5;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;

    pointer-events:none;

    color:white;
}

#top{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
}

.panel{
    padding:8px 12px;

    border-radius:12px;

    background:rgba(0,0,0,.55);

    border:1px solid
        rgba(255,255,255,.12);

    backdrop-filter:blur(8px);
}

#healthBox{
    width:175px;
}

#healthBar{
    width:100%;
    height:7px;

    margin-top:5px;

    overflow:hidden;

    border-radius:20px;

    background:#333;
}

#healthFill{
    width:100%;
    height:100%;

    background:#32d879;
}

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:20px;
    height:20px;

    transform:
        translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";

    position:absolute;

    background:white;

    opacity:.8;
}

#crosshair:before{
    width:20px;
    height:2px;

    top:9px;
}

#crosshair:after{
    width:2px;
    height:20px;

    left:9px;
}

#weapon{
    position:absolute;

    right:15px;
    bottom:150px;

    text-align:right;
}

#weaponName{
    font-size:13px;
    opacity:.7;
}

#ammo{
    font-size:25px;
    font-weight:bold;
}

#message{
    position:absolute;

    top:85px;
    left:50%;

    transform:
        translateX(-50%);

    padding:9px 15px;

    border-radius:10px;

    background:
        rgba(0,0,0,.65);

    opacity:0;

    transition:.2s;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
    position:absolute;

    left:25px;
    bottom:25px;

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    border:2px solid
        rgba(255,255,255,.18);

    pointer-events:auto;
}

#stick{
    position:absolute;

    width:62px;
    height:62px;

    left:50%;
    top:50%;

    margin-left:-31px;
    margin-top:-31px;

    border-radius:50%;

    background:
        rgba(255,255,255,.25);

    border:2px solid
        rgba(255,255,255,.15);
}

/* =========================
   CAMERA
========================= */

#cameraArea{
    position:absolute;

    right:0;
    top:0;

    width:62%;
    height:78%;

    pointer-events:auto;
}

/* =========================
   BUTTONS
========================= */

.btn{
    position:absolute;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    color:white;

    font-size:10px;
    font-weight:bold;

    background:
        rgba(255,255,255,.12);

    border:1px solid
        rgba(255,255,255,.22);

    backdrop-filter:blur(7px);

    pointer-events:auto;
}

#fire{
    right:25px;
    bottom:25px;

    width:80px;
    height:80px;

    background:
        rgba(210,40,40,.42);
}

#jump{
    right:120px;
    bottom:40px;

    width:58px;
    height:58px;
}

#action{
    right:180px;
    bottom:110px;

    width:58px;
    height:58px;
}

#pickup{
    right:105px;
    bottom:120px;

    width:64px;
    height:64px;

    display:none;

    background:
        rgba(35,130,255,.42);
}

/* =========================
   DEATH
========================= */

#dead{
    position:fixed;
    inset:0;

    z-index:500;

    display:none;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    color:white;

    background:
        rgba(0,0,0,.8);
}

#dead h1{
    font-size:42px;
}

</style>

/* =====================================================
   CONTROLE DE CARREGAMENTO
===================================================== */

let threeLoaded=false;

let firebaseAppLoaded=false;

let firebaseDatabaseLoaded=false;

let gameStarted=false;


function setLoading(
    text,
    progress
){

    document.getElementById(
        "loadingText"
    ).textContent=text;

    document.getElementById(
        "progressBar"
    ).style.width=
        progress+"%";
}


function libraryError(name){

    const box=
        document.getElementById(
            "errorBox"
        );

    box.style.display="block";

    box.innerHTML=
        "<b>Não foi possível carregar "+
        name+
        ".</b><br><br>"+
        "Verifique se o WebView está "+
        "com acesso à internet. "+
        "Depois recarregue o jogo.";

    setLoading(
        "Erro ao carregar biblioteca",
        0
    );
}


function checkLibraries(){

    if(gameStarted)
        return;

    if(
        threeLoaded &&
        firebaseAppLoaded &&
        firebaseDatabaseLoaded
    ){

        gameStarted=true;

        setLoading(
            "Bibliotecas carregadas...",
            15
        );

        setTimeout(
            startGame,
            100
        );
    }
}

</script>

/* =====================================================

function createBox(
    x,y,z,
    w,h,d,
    material,
    solid=true
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );


    mesh.position.set(
        x,y,z
    );


    scene.add(mesh);


    if(solid){

        colliders.push({

            minX:x-w/2,
            maxX:x+w/2,

            minY:y-h/2,
            maxY:y+h/2,

            minZ:z-d/2,
            maxZ:z+d/2,

            active:true

        });
    }


    return mesh;
}

/* =====================================================
   PORTA
===================================================== */

function createDoor(
    x,y,z
){

    const pivot=
        new THREE.Group();


    pivot.position.set(
        x-.6,
        y,
        z
    );


    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                2.5,
                .12
            ),
            MAT.wood
        );


    mesh.position.x=.6;


    pivot.add(mesh);


    scene.add(pivot);


    const collider={

        minX:x-.6,
        maxX:x+.6,

        minY:y-1.25,
        maxY:y+1.25,

        minZ:z-.1,
        maxZ:z+.1,

        active:true

    };


    colliders.push(
        collider
    );


    const door={

        pivot:pivot,

        collider:collider,

        open:false,

        target:0

    };


    doors.push(
        door
    );


    return door;
}

    createBox(

        1.5,
        3,

    );

        0

    armR.position.set(

        2.65,
        0
    );


    legL.position.set(

    );


    legR.position.set(

        0
    );


    a1.position.y=-.55;
    a2.position.y=-.55;

    l1.position.y=-.55;
    l2.position.y=-.55;


    armL.add(a1);
    armR.add(a2);

    legL.add(l1);
    legR.add(l2);


    root.add(
        armL,
        armR,
        legL,
        legR
    );


    /* arma */

    const gun=
        new THREE.Group();


    const gunBody=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .2,
                .2,
                .9
            ),
            MAT.black
        );


    gunBody.position.z=-.4;


    gun.add(
        gunBody
    );


    gun.position.set(
        .1,
        -.9,
        -.15
    );


    armR.add(gun);


    gun.visible=false;


    /* paraquedas */

    const parachute=
        new THREE.Group();


    const canopy=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                3,
                12,
                6,
                0,
                Math.PI*2,
                0,
                Math.PI/2
            ),
            MAT.red
        );


    canopy.scale.y=.45;

    canopy.position.y=7;


    parachute.add(
        canopy
    );


    root.add(
        parachute
    );


    parachute.visible=false;


    return{

        root:root,

        armL:armL,

        armR:armR,

        legL:legL,

        legR:legR,

        gun:gun,

        parachute:parachute

    };
}

/* =====================================================
   JOYSTICK
===================================================== */

let joyX=0;

let joyY=0;

let joyActive=false;


const joystick=
    document.getElementById(
        "joystick"
    );


const stick=
    document.getElementById(
        "stick"
    );


function updateJoystick(e){

    const r=
        joystick.getBoundingClientRect();


    const cx=
        r.left+
        r.width/2;


    const cy=
        r.top+
        r.height/2;


    let dx=
        e.clientX-cx;


    let dy=
        e.clientY-cy;


    const max=55;


    const len=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;
    }


    joyX=dx/max;

    joyY=dy/max;


    stick.style.transform=
        "translate("+
        dx+
        "px,"+
        dy+
        "px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        joyActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(joyActive)
            updateJoystick(e);
    }
);


joystick.addEventListener(
    "pointerup",
    function(){

        joyActive=false;

        joyX=0;

        joyY=0;

        stick.style.transform=
            "translate(0,0)";
    }
);


/* =====================================================
   CÂMERA TOUCH
===================================================== */

let cameraTouch=null;


const cameraArea=
    document.getElementById(
        "cameraArea"
    );


cameraArea.addEventListener(
    "pointerdown",
    function(e){

        cameraTouch={

            id:e.pointerId,

            x:e.clientX,

            y:e.clientY

        };


        cameraArea.setPointerCapture(
            e.pointerId
        );
    }
);


cameraArea.addEventListener(
    "pointermove",
    function(e){

        if(
            !cameraTouch ||
            cameraTouch.id!==e.pointerId
        )
            return;


        const dx=
            e.clientX-
            cameraTouch.x;


        const dy=
            e.clientY-
            cameraTouch.y;


        cameraTouch.x=
            e.clientX;


        cameraTouch.y=
            e.clientY;


        /*
          CÂMERA NÃO INVERTIDA

          dedo → direita
          câmera → direita

          dedo → esquerda
          câmera → esquerda

          dedo → cima
          câmera → cima

          dedo → baixo
          câmera → baixo
        */

        player.yaw+=
            dx*.006;


        player.pitch+=
            dy*.006;


        player.pitch=
            THREE.MathUtils.clamp(
                player.pitch,
                -1.25,
                1.25
            );
    }
);


cameraArea.addEventListener(
    "pointerup",
    function(){

        cameraTouch=null;

    }
);


/* =====================================================
   COLISÃO
===================================================== */

function blocked(
    x,z
){

    const radius=.4;


    for(
        const c of colliders
    ){

        if(!c.active)
            continue;


        if(

            x+radius>c.minX &&
            x-radius<c.maxX &&
            z+radius>c.minZ &&
            z-radius<c.maxZ

        ){

            return true;

        }
    }


    return false;
}


function movePlayer(
    dx,dz
){

    if(
        !blocked(
            player.x+dx,
            player.z
        )
    ){

        player.x+=dx;
    }


    if(
        !blocked(
            player.x,
            player.z+dz
        )
    ){

        player.z+=dz;
    }
}


/* =====================================================
   FÍSICA
===================================================== */

function updatePhysics(dt){

    /* PARAQUEDAS */

    if(player.parachuting){

        player.y-=2.2*dt;


        const fx=
            Math.sin(
                player.yaw
            );


        const fz=
            Math.cos(
                player.yaw
            );


        const rx=
            Math.cos(
                player.yaw
            );


        const rz=
            -Math.sin(
                player.yaw
            );


        movePlayer(

            (
                fx*(-joyY)+
                rx*joyX
            )*3*dt,

            (
                fz*(-joyY)+
                rz*joyX
            )*3*dt

        );


        if(player.y<=0){

            player.y=0;

            player.parachuting=false;

            player.grounded=true;

            player.state="land";

            player.model
                .parachute
                .visible=false;


            showMessage(
                "ATERRISSAGEM!"
            );
        }


        return;
    }


    /* GRAVIDADE */

    player.vy-=22*dt;

    player.y+=
        player.vy*dt;


    if(player.y<=0){

        player.y=0;

        player.vy=0;

        player.grounded=true;

    }else{

        player.grounded=false;
    }


    /* MOVIMENTO */

    const moving=
        Math.abs(joyX)>.08 ||
        Math.abs(joyY)>.08;


    if(moving){

        const fx=
            Math.sin(
                player.yaw
            );


        const fz=
            Math.cos(
                player.yaw
            );


        const rx=
            Math.cos(
                player.yaw
            );


        const rz=
            -Math.sin(
                player.yaw
            );


        movePlayer(

            (
                fx*(-joyY)+
                rx*joyX
            )*
            player.speed*
            dt,

            (
                fz*(-joyY)+
                rz*joyX
            )*
            player.speed*
            dt

        );


        player.state=
            player.grounded
            ? "walk"
            : "fall";


        player.anim+=
            dt*10;


        const dx=
            fx*(-joyY)+
            rx*joyX;


        const dz=
            fz*(-joyY)+
            rz*joyX;


        if(
            Math.abs(dx)+
            Math.abs(dz)>.01
        ){

            player.model
                .root
                .rotation.y=
                THREE.MathUtils.lerp(

                    player.model
                        .root
                        .rotation.y,

                    Math.atan2(
                        dx,
                        dz
                    ),

                    .2
                );
        }

    }else if(
        player.grounded
    ){

        player.state="idle";
    }
}


/* =====================================================
   ANIMAÇÃO
===================================================== */

function updateAnimation(){

    const m=
        player.model;


    let swing=0;


    if(
        player.state==="walk"
    ){

        swing=
            Math.sin(
                player.anim
            )*.65;
    }


    m.armL.rotation.x=
        THREE.MathUtils.lerp(
            m.armL.rotation.x,
            player.weapon
            ? -.7
            : swing,
            .25
        );


    m.armR.rotation.x=
        THREE.MathUtils.lerp(
            m.armR.rotation.x,
            player.weapon
            ? -1.1
            : -swing,
            .25
        );


    m.legL.rotation.x=
        THREE.MathUtils.lerp(
            m.legL.rotation.x,
            -swing,
            .25
        );


    m.legR.rotation.x=
        THREE.MathUtils.lerp(
            m.legR.rotation.x,
            swing,
            .25
        );


    m.parachute.visible=
        player.parachuting;
}

   CÂMERA
===================================================== */

function updateCamera(){

    const target=
        new THREE.Vector3(

            player.x,

            player.y+2.2,

            player.z

        );


    const cp=
        Math.cos(
            player.pitch
        );


    const forward=
        new THREE.Vector3(

            Math.sin(
                player.yaw
            )*cp,

            Math.sin(
                player.pitch
            ),

            Math.cos(
                player.yaw
            )*cp

        );


    const distance=6.5;


    const desired=
        new THREE.Vector3(

            target.x-
            forward.x*distance,

            target.y-
            forward.y*distance,

            target.z-
            forward.z*distance

        );


    camera.position.lerp(
        desired,
        .18
    );


    camera.lookAt(

        target.x+
        forward.x*10,

        target.y+
        forward.y*10,

        target.z+
        forward.z*10

    );
}

function updateDoors(){

    for(
        const door of doors
    ){

        door.pivot.rotation.y=
            THREE.MathUtils.lerp(

                door.pivot.rotation.y,

                door.target,

                .15
            );


        door.collider.active=
            !door.open;
    }
}


function nearestDoor(){

    let best=null;

    let distance=3;


    for(
        const door of doors
    ){

        const dx=
            door.pivot.position.x-
            player.x;


        const dz=
            door.pivot.position.z-
            player.z;


        const d=
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        if(d<distance){

            distance=d;

            best=door;
        }
    }


    return best;
}

        door.target=

            ? -Math.PI/2
            : 0;
    }
);

/* =====================================================
   TIRO
===================================================== */

function shoot(){

    if(
        !player.alive ||
        player.parachuting ||
        !player.weapon
    )
        return;


    const weapon=
        weapons[
            player.weapon
        ];


    if(
        player.fireCooldown>0
    )
        return;


    if(
        player.ammo<=0
    ){

        showMessage(
            "SEM MUNIÇÃO"
        );

        return;
    }


    player.fireCooldown=
        weapon.rate;


    player.ammo--;

    updateWeaponUI();


    const origin=
        camera.position.clone();


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const ray=
        new THREE.Raycaster(

            origin,

            direction.normalize(),

            0,

            weapon.range

        );


    const targets=[];


    for(
        const id in remotePlayers
    ){

        if(
            remotePlayers[id] &&
            remotePlayers[id].model
        ){

            targets.push(
                remotePlayers[id]
                    .model
                    .root
            );
        }
    }


    const hits=
        ray.intersectObjects(
            targets,
            true
        );


    let end=
        origin.clone().add(
            direction
                .clone()
                .multiplyScalar(
                    weapon.range
                )
        );


    let targetId=null;


    if(
        hits.length>0
    ){

        end=
            hits[0].point.clone();


        for(
            const id in remotePlayers
        ){

            const root=
                remotePlayers[id]
                    .model
                    .root;


            let object=
                hits[0].object;


            while(object){

                if(
                    object===root
                ){

                    targetId=id;

                    break;
                }


                object=
                    object.parent;
            }


            if(targetId)
                break;
        }
    }


    createTracer(
        origin,
        end
    );


    if(
        targetId &&
        db
    ){

        db.ref(
            "damageEvents"
        ).push({

            shooter:player.id,

            target:targetId,

            damage:weapon.damage,

            weapon:player.weapon,

            time:
                firebase.database
                    .ServerValue
                    .TIMESTAMP

        });
    }
}


function createTracer(
    start,
    end
){

    const geometry=
        new THREE.BufferGeometry()
            .setFromPoints([
                start,
                end
            ]);


    const material=
        new THREE.LineBasicMaterial({
            color:0xffd83d
        });


    const line=
        new THREE.Line(
            geometry,
            material
        );


    scene.add(line);


    setTimeout(
        function(){

            scene.remove(line);

            geometry.dispose();

            material.dispose();

        },
        100
    );
}

/* =====================================================
   DANO

const processedDamage=
    new Set();


db.ref(
    "damageEvents"
).on(
    "child_added",
    function(snapshot){

        const id=
            snapshot.key;


        if(
            processedDamage.has(id)
        )
            return;


        processedDamage.add(id);


        const data=
            snapshot.val();


        if(
            !data ||
            data.target!==player.id ||
            !player.alive
        )
            return;


        player.hp=
            Math.max(
                0,
                player.hp-data.damage
            );


        updateHealth();


        if(
            player.hp<=0
        ){

            eliminate(
                data.shooter
            );
        }
    }
);

function eliminate(
    killer
){

    if(
        !player.alive
    )
        return;


    player.alive=false;

    player.state="dead";


    db.ref(
        "players/"+player.id
    ).update({

        alive:false,

        hp:0,

        state:"dead",

        killer:
            killer||null

    });


    document.getElementById(
        "dead"
    ).style.display="flex";


    setTimeout(
        respawn,
        4000
    );
}


function respawn(){

        (Math.floor(
            Math.random()*7
        )-3)*42;


    player.z=
        (Math.floor(
            Math.random()*7
        )-3)*42;


    player.y=28;

    player.hp=100;

    player.alive=true;

    player.parachuting=true;

    player.grounded=false;

    player.state="parachute";

    player.weapon=null;

    ).style.display="none";
}

/* =====================================================
   MULTIPLAYER
===================================================== */

const playersRef=
    db.ref("players");


function createRemotePlayer(
    data
){

    const model=
        createCharacter();


    model.root.position.set(

        data.x||0,

        data.y||0,

        data.z||0

    );


    scene.add(
        model.root
    );


    return{

        model:model,

        data:data,

        targetX:data.x||0,

        targetY:data.y||0,

        targetZ:data.z||0

    };
}


playersRef.on(
    "child_added",
    function(snapshot){

        const data=
            snapshot.val();


        if(
            !data ||
            data.id===player.id
        )
            return;


        remotePlayers[
            data.id
        ]=
            createRemotePlayer(
                data
            );
    }
);


playersRef.on(
    "child_changed",
    function(snapshot){

        const data=
            snapshot.val();


        if(
            !data ||
            data.id===player.id
        )
            return;


        let remote=
            remotePlayers[
                data.id
            ];


        if(!remote){

            remote=
                createRemotePlayer(
                    data
                );


            remotePlayers[
                data.id
            ]=remote;
        }


        remote.data=data;

        remote.targetX=
            data.x||0;

        remote.targetY=
            data.y||0;

        remote.targetZ=
            data.z||0;
    }
);


playersRef.on(
    "child_removed",
    function(snapshot){

        const id=
            snapshot.key;


        if(
            remotePlayers[id]
        ){

            scene.remove(
                remotePlayers[id]
                    .model
                    .root
            );


            delete
                remotePlayers[id];
        }
    }
);


playersRef.on(
    "value",
    function(snapshot){

        const players=
            snapshot.val()||{};


        document.getElementById(
            "online"
        ).textContent=
            Object.keys(
                players
            ).length;
    }
);

/* =====================================================
   REMOTOS
===================================================== */

function updateRemotePlayers(){

    for(
        const id in remotePlayers
    ){

        const remote=
            remotePlayers[id];


        const model=
            remote.model;


        model.root.position.x=
            THREE.MathUtils.lerp(

                model.root.position.x,

                remote.targetX,

                .2
            );


        model.root.position.y=
            THREE.MathUtils.lerp(

                model.root.position.y,

                remote.targetY,

                .2
            );


        model.root.position.z=
            THREE.MathUtils.lerp(

                model.root.position.z,

                remote.targetZ,

                .2
            );


        model.root.rotation.y=
            remote.data.rotation||0;


        model.parachute.visible=
            !!remote.data.parachuting;


        model.gun.visible=
            !!remote.data.weapon;


        if(
            remote.data.state==="walk"
        ){

            const t=
                performance.now()*.01;


            model.legL.rotation.x=
                Math.sin(t)*.6;


            model.legR.rotation.x=
                -Math.sin(t)*.6;


            model.armL.rotation.x=
                -Math.sin(t)*.5;


            model.armR.rotation.x=
                Math.sin(t)*.5;
        }
    }
}


/* =====================================================
   LOOP
===================================================== */

let lastTime=
    performance.now();


function gameLoop(){

    requestAnimationFrame(
        gameLoop
    );


    const now=
        performance.now();


    const dt=
        Math.min(
            .033,
            (now-lastTime)/1000
        );


    lastTime=now;


    updatePhysics(
        dt
    );


    updateDoors();

    updateAnimation();

    updateCamera();

    updateRemotePlayers();

    updatePickupButton();


    if(
        player.fireCooldown>0
    ){

        player.fireCooldown=
            Math.max(
                0,
                player.fireCooldown-dt
            );
    }


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   INICIAR
===================================================== */

setLoading(
    "Preparando cidade...",
    80
);


setTimeout(
    function(){

        setLoading(
            "Preparando jogador...",
            90
        );


        player.model.root.position.set(

            player.x,

            player.y,

            player.z

        );


        player.model.parachute.visible=true;


        updateHealth();

        updateWeaponUI();


        setTimeout(
            function(){

                setLoading(
                    "Pronto!",
                    100
                );


                setTimeout(
                    function(){

                        document
                            .getElementById(
                                "loading"
                            )
                            .style
                            .display="none";


                        showMessage(
                            "Você está descendo de paraquedas!"
                        );

                    },
                    300
                );

            },
            300
        );

    },
    300
);


/* =====================================================
   REDE
===================================================== */

setInterval(
    savePlayer,
    100
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =====================================================
   COMEÇAR LOOP
===================================================== */

gameLoop();

}


/* =====================================================
   ERRO GERAL
===================================================== */

function showError(
    text
){

    const box=
        document.getElementById(
            "errorBox"
        );


    box.style.display="block";

    box.innerHTML=text;
}

</script>
