<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubjectRobot App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center">

    <!-- Container Principal do App Mobile -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[700px] sm:h-[800px] sm:rounded-3xl sm:shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-lg font-bold">SubjectRobot</h1>
            
            <!-- Bolinha de Perfil -->
            <button onclick="abrirTelaPerfil()" class="w-10 h-10 rounded-full bg-indigo-400 overflow-hidden border-2 border-white focus:outline-none focus:ring-2 focus:ring-white transition shadow">
                <img id="header-avatar" src="" alt="Perfil" class="w-full h-full object-cover hidden">
                <span id="header-initial" class="w-full h-full flex items-center justify-center font-bold text-sm">?</span>
            </button>
        </header>

        <!-- TELA DE LOADING/VERIFICAÇÃO DE PASTA -->
        <main id="screen-loading" class="flex-1 p-6 flex flex-col justify-center items-center text-center">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 class="text-lg font-semibold text-gray-700">Verificando credenciais do dispositivo...</h2>
            <p class="text-xs text-gray-400 mt-2">Buscando pasta de sessão local.</p>
        </main>

        <!-- TELA PRINCIPAL (HOME) - Oculta até validar a pasta -->
        <main id="screen-home" class="flex-1 p-6 flex flex-col justify-center items-center text-center hidden">
            <div class="mb-6">
                <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600 shadow-inner">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <h2 id="welcome-name" class="text-2xl font-bold text-gray-800">Carregando...</h2>
                <p class="text-sm text-gray-500 mt-1">Sessão validada automaticamente pela pasta local do celular.</p>
            </div>
            
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 w-full text-left shadow-sm">
                <p class="text-xs text-indigo-700 font-semibold uppercase tracking-wider">ID da Sessão (Vinculado à Pasta):</p>
                <p id="device-id-display" class="text-xs text-gray-600 font-mono mt-1 break-all bg-white p-2 rounded border border-indigo-100"></p>
            </div>
        </main>

        <!-- TELA DE PERFIL -->
        <div id="screen-profile" class="absolute inset-0 bg-white transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col z-20">
            <!-- Header da Tela de Perfil -->
            <div class="bg-indigo-600 text-white p-4 flex items-center shadow-md">
                <button onclick="fecharTelaPerfil()" class="mr-3 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-lg font-bold">Editar Perfil</h2>
            </div>

            <!-- Conteúdo da Tela de Perfil -->
            <div class="flex-1 p-6 overflow-y-auto">
                <div class="flex flex-col items-center mb-6">
                    <div class="relative w-28 h-28 rounded-full bg-gray-200 overflow-hidden border-4 border-indigo-50 shadow-md">
                        <img id="profile-avatar" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                        <span id="profile-initial" class="w-full h-full flex items-center justify-center text-3xl font-bold text-gray-500">?</span>
                    </div>
                    
                    <label class="mt-4 cursor-pointer bg-white border border-indigo-600 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm hover:bg-indigo-50 transition">
                        Alterar Foto
                        <input type="file" id="input-file" accept="image/*" class="hidden" onchange="converterImagemBase64(event)">
                    </label>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Perfil</label>
                    <input type="text" id="input-name" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="Seu nome">
                </div>

                <button onclick="salvarPerfil()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition mt-4">
                    Salvar Alterações
                </button>
            </div>
        </div>

    </div>

    <!-- Scripts de Configuração e Lógica -->
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCTkq0uXy5kHg9N8rj9--Dooh8cuguYxPE",
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com",
            projectId: "subjectrobot-49600",
            storageBucket: "subjectrobot-49600.appspot.com",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let meuDeviceId = "";
        let imagemBase64Temp = "";

        // Inicialização ao carregar a página
        window.onload = async function() {
            await verificarOuCriarPastaNoCelular();
        };

        /**
         * Simula a lógica de verificação de diretório/pasta no armazenamento do celular.
         * Em WebViews nativas do Android (Sketchware/Cordova/Capacitor), isso utiliza o sistema de arquivos. 
         * No navegador padrão, emula uma "pasta" de dados persistente segura.
         */
        async function verificarOuCriarPastaNoCelular() {
            try {
                let idSalvo = null;

                // Tenta verificar se o ambiente possui FileSystem nativo (ex: Cordova/Capacitor)
                if (window.resolveLocalFileSystemURL && window.PERSISTENT) {
                    idSalvo = await verificarPastaNativaAndroid();
                } else {
                    // Fallback estruturado simulando a pasta no armazenamento persistente do app
                    idSalvo = localStorage.getItem('SubjectRobot_Session/device_id');
                }

                if (!idSalvo) {
                    // Primeira vez abrindo o app: Cria o ID único e a "pasta/registro" de sessão
                    idSalvo = 'device_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    await criarPastaNoCelular(idSalvo);
                }

                meuDeviceId = idSalvo;
                document.getElementById('device-id-display').innerText = meuDeviceId;
                
                // Faz o login automático carregando os dados do RTDB
                carregarDadosDoBanco();

            } catch (erro) {
                console.error("Erro ao verificar pasta do celular:", erro);
                // Fallback de segurança caso ocorra erro no acesso ao sistema de arquivos
                meuDeviceId = localStorage.getItem('SubjectRobot_Session/device_id') || ('fallback_' + Math.random().toString(36).substring(2, 8));
                localStorage.setItem('SubjectRobot_Session/device_id', meuDeviceId);
                carregarDadosDoBanco();
            }
        }

        // Função para simular a criação da pasta física de sessão no dispositivo
        async function criarPastaNoCelular(deviceId) {
            return new Promise((resolve) => {
                // Se estiver rodando dentro do Android nativo, tenta criar o diretório real
                if (window.resolveLocalFileSystemURL) {
                    window.resolveLocalFileSystemURL(cordova.file.dataDirectory, function (dirEntry) {
                        dirEntry.getDirectory("SubjectRobot_Session", { create: true }, function (subDir) {
                            subDir.getFile("session.json", { create: true }, function (fileEntry) {
                                fileEntry.createWriter(function (fileWriter) {
                                    fileWriter.write(JSON.stringify({ id: deviceId, createdAt: new Date().toISOString() }));
                                    resolve();
                                });
                            });
                        });
                    }, () => {
                        // Caso falhe, grava no armazenamento local padrão simulando a pasta
                        localStorage.setItem('SubjectRobot_Session/device_id', deviceId);
                        resolve();
                    });
                } else {
                    // Ambiente Web/WebView padrão: Armazena a chave simulando a pasta de sessão
                    localStorage.setItem('SubjectRobot_Session/device_id', deviceId);
                    setTimeout(resolve, 400); // Pequeno delay simulando leitura/escrita de I/O de diretório
                }
            });
        }

        // Verifica se a pasta e o arquivo de sessão já existem no armazenamento nativo
        function verificarPastaNativaAndroid() {
            return new Promise((resolve) => {
                if (window.resolveLocalFileSystemURL && window.cordova) {
                    window.resolveLocalFileSystemURL(cordova.file.dataDirectory + "SubjectRobot_Session/session.json", function (fileEntry) {
                        file.file(fileEntry, function (file) {
                            const reader = new FileReader();
                            reader.onloadend = function() {
                                try {
                                    const data = JSON.parse(this.result);
                                    resolve(data.id);
                                } catch(e) { resolve(null); }
                            };
                            reader.readAsText(file);
                        });
                    }, function () {
                        resolve(null); // Pasta ou arquivo não encontrado (primeiro acesso)
                    });
                } else {
                    resolve(localStorage.getItem('SubjectRobot_Session/device_id'));
                }
            });
        }

        // Sincroniza e puxa os dados do Firebase RTDB para o login automático
        function carregarDadosDoBanco() {
            const userRef = db.ref('usuarios/' + meuDeviceId);
            
            userRef.on('value', (snapshot) => {
                const dados = snapshot.val();
                let nomeUsuario = "Usuário Anônimo";
                let avatarUrl = "";

                if (dados) {
                    nomeUsuario = dados.nome || "Usuário Anônimo";
                    avatarUrl = dados.avatar || "";
                } else {
                    // Primeiro registro deste dispositivo no banco de dados
                    userRef.set({
                        nome: "Usuário " + meuDeviceId.substring(0, 6),
                        avatar: ""
                    });
                    nomeUsuario = "Usuário " + meuDeviceId.substring(0, 6);
                }

                document.getElementById('welcome-name').innerText = `Olá, ${nomeUsuario}`;
                document.getElementById('input-name').value = nomeUsuario;
                
                atualizarAvatares(avatarUrl, nomeUsuario);

                // Alterna para a tela principal ocultando o carregamento
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-home').classList.remove('hidden');
            });
        }

        // Atualiza elementos visuais da foto/iniciais
        function atualizarAvatares(base64Data, nome) {
            const headerAvatar = document.getElementById('header-avatar');
            const headerInitial = document.getElementById('header-initial');
            const profileAvatar = document.getElementById('profile-avatar');
            const profileInitial = document.getElementById('profile-initial');
            const inicialLetra = nome ? nome.charAt(0).toUpperCase() : '?';

            if (base64Data && base64Data.startsWith('data:image')) {
                headerAvatar.src = base64Data;
                headerAvatar.classList.remove('hidden');
                headerInitial.classList.add('hidden');

                profileAvatar.src = base64Data;
                profileAvatar.classList.remove('hidden');
                profileInitial.classList.add('hidden');
                
                imagemBase64Temp = base64Data;
            } else {
                headerAvatar.classList.add('hidden');
                headerInitial.classList.remove('hidden');
                headerInitial.innerText = inicialLetra;

                profileAvatar.classList.add('hidden');
                profileInitial.classList.remove('hidden');
                profileInitial.innerText = inicialLetra;
                
                imagemBase64Temp = "";
            }
        }

        // Conversão de imagem para Base64 com redimensionamento otimizado
        function converterImagemBase64(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let largura = img.width;
                    let altura = img.height;
                    const maxTamanho = 200;

                    if (largura > altura) {
                        if (largura > maxTamanho) {
                            altura *= maxTamanho / largura;
                            largura = maxTamanho;
                        }
                    } else {
                        if (altura > maxTamanho) {
                            largura *= maxTamanho / altura;
                            altura = maxTamanho;
                        }
                    }

                    canvas.width = largura;
                    canvas.height = altura;
                    ctx.drawImage(img, 0, 0, largura, altura);

                    const base64Compactado = canvas.toDataURL('image/jpeg', 0.7);
                    imagemBase64Temp = base64Compactado;
                    
                    const nomeAtual = document.getElementById('input-name').value;
                    atualizarAvatares(base64Compactado, nomeAtual);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(arquivo);
        }

        // Salvar alterações no perfil e enviar imagem em Base64 para o Realtime Database
        function salvarPerfil() {
            const novoNome = document.getElementById('input-name').value.trim();
            
            if (!novoNome) {
                alert("O nome não pode ficar vazio!");
                return;
            }

            db.ref('usuarios/' + meuDeviceId).update({
                nome: novoNome,
                avatar: imagemBase64Temp
            }, (error) => {
                if (error) {
                    alert("Erro ao salvar dados no banco!");
                } else {
                    alert("Perfil atualizado com sucesso!");
                    fecharTelaPerfil();
                }
            });
        }

        function abrirTelaPerfil() {
            document.getElementById('screen-profile').classList.remove('translate-x-full');
        }

        function fecharTelaPerfil() {
            document.getElementById('screen-profile').classList.add('translate-x-full');
        }
    </script>
</body>
</html>
