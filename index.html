<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev.rik Java IDE</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --editor-bg: #1e1e1e;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --accent-hover: #005999;
            --error-color: #f48771;
            --warning-color: #cca700;
            --border-color: #333333;
            --console-bg: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: #3c3c3c;
        }
        button.secondary:hover {
            background-color: #4c4c4c;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--editor-bg);
        }

        .editor-wrapper {
            display: flex;
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .line-numbers {
            width: 50px;
            background-color: var(--editor-bg);
            color: #858585;
            padding: 12px 0;
            text-align: right;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
            border-right: 1px solid #333;
        }

        .line-numbers span {
            display: block;
            padding-right: 10px;
        }

        .line-numbers span.error-line-num {
            color: var(--error-color);
            font-weight: bold;
        }

        textarea {
            flex: 1;
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            caret-color: #ffffff;
            tab-size: 4;
        }

        /* Painel Lateral / Análise Inteligente */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #bbbbbb;
            background-color: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .diagnostics-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
        }

        .diagnostic-item {
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            background-color: #2d2d2d;
            border-left: 4px solid var(--error-color);
        }

        .diagnostic-item.warning {
            border-left-color: var(--warning-color);
        }

        .diagnostic-item .diag-line {
            font-weight: bold;
            color: var(--error-color);
            font-size: 11px;
        }

        .diagnostic-item.warning .diag-line {
            color: var(--warning-color);
        }

        /* Console de Saída */
        .console-panel {
            height: 180px;
            background-color: var(--console-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .console-output {
            flex: 1;
            padding: 10px 15px;
            font-size: 13px;
            overflow-y: auto;
            color: #cccccc;
            white-space: pre-wrap;
        }

        .status-bar {
            background-color: var(--accent-color);
            color: white;
            padding: 3px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <h1>☕ Dev.rik Java IDE <span style="font-size: 11px; background: #333; padding: 2px 6px; border-radius: 3px; color: #aaa;">API Online</span></h1>
        <div class="actions">
            <button class="secondary" onclick="clearEditor()">Limpar Código</button>
            <button id="runBtn" onclick="runJavaCode()">▶ Executar Código</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Editor de Código -->
        <div class="editor-container">
            <div class="editor-wrapper">
                <div id="lineNumbers" class="line-numbers"><span>1</span></div>
                <textarea id="codeEditor" spellcheck="false" placeholder="Escreva seu código Java aqui...">public class Main {
    public static void main(String[] args) {
        System.out.println("Olá, Mundo do Java!");
        
        int x = 10;
        int y = 20;
        System.out.println("Soma: " + (x + y));
    }
}</textarea>
            </div>
            
            <!-- Terminal de Saída -->
            <div class="console-panel">
                <div class="sidebar-header">Terminal de Saída</div>
                <div id="consoleOutput" class="console-output">Pronto para compilar e executar... Clique em "Executar Código".</div>
            </div>
        </div>

        <!-- Analisador de Erros Em Tempo Real (Linter) -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <span>🔍 Analisador Inteligente</span>
                    <span id="errorCount" style="background: var(--error-color); color: #000; padding: 1px 6px; border-radius: 10px; font-size: 10px;">0</span>
                </div>
                <div id="diagnosticsList" class="diagnostics-list">
                    <div style="color: #6a9955; font-style: italic;">Nenhum erro estrutural detectado.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusMessage">Java 15.0.2 (Piston API)</span>
        <span id="cursorPosition">Linha 1, Coluna 1</span>
    </div>

    <script>
        const codeEditor = document.getElementById('codeEditor');
        const lineNumbers = document.getElementById('lineNumbers');
        const diagnosticsList = document.getElementById('diagnosticsList');
        const errorCountBadge = document.getElementById('errorCount');
        const consoleOutput = document.getElementById('consoleOutput');
        const cursorPosition = document.getElementById('cursorPosition');
        const runBtn = document.getElementById('runBtn');

        // Atualização de Linhas e Inspeção Inteligente
        codeEditor.addEventListener('input', () => {
            updateLineNumbers();
            runSmartLinter();
        });

        codeEditor.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeEditor.scrollTop;
        });

        codeEditor.addEventListener('click', updateCursorPosition);
        codeEditor.addEventListener('keyup', updateCursorPosition);

        // Auto-Indentação Padrão ao dar Enter
        codeEditor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cursorPos = codeEditor.selectionStart;
                const text = codeEditor.value;
                
                const lastNewline = text.lastIndexOf('\n', cursorPos - 1);
                const currentLine = text.substring(lastNewline + 1, cursorPos);
                
                const match = currentLine.match(/^([ \t]*)/);
                let indentation = match ? match[1] : '';
                
                if (currentLine.trim().endsWith('{')) {
                    indentation += '    ';
                }

                const newValue = text.substring(0, cursorPos) + '\n' + indentation + text.substring(codeEditor.selectionEnd);
                codeEditor.value = newValue;
                codeEditor.selectionStart = codeEditor.selectionEnd = cursorPos + 1 + indentation.length;
                
                updateLineNumbers();
                runSmartLinter();
            }
            
            // Suporte para tecla Tab
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeEditor.selectionStart;
                const end = codeEditor.selectionEnd;

                codeEditor.value = codeEditor.value.substring(0, start) + '    ' + codeEditor.value.substring(end);
                codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
            }
        });

        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n');
            let numbersHTML = '';
            for (let i = 1; i <= lines.length; i++) {
                numbersHTML += `<span>${i}</span>`;
            }
            lineNumbers.innerHTML = numbersHTML;
        }

        function updateCursorPosition() {
            const text = codeEditor.value;
            const selStart = codeEditor.selectionStart;
            const line = text.substr(0, selStart).split('\n').length;
            const col = selStart - text.lastIndexOf('\n', selStart - 1);
            cursorPosition.innerText = `Linha ${line}, Coluna ${col}`;
        }

        function clearEditor() {
            if (confirm("Deseja limpar o código do editor?")) {
                codeEditor.value = "";
                updateLineNumbers();
                runSmartLinter();
            }
        }

        // --- LINTER INTELIGENTE ---
        function runSmartLinter() {
            const code = codeEditor.value;
            const lines = code.split('\n');
            let diagnostics = [];
            let errorLinesSet = new Set();

            lines.forEach((lineText, index) => {
                const lineNum = index + 1;
                const trimmed = lineText.trim();

                if (
                    trimmed !== '' &&
                    !trimmed.endsWith(';') &&
                    !trimmed.endsWith('{') &&
                    !trimmed.endsWith('}') &&
                    !trimmed.startsWith('//') &&
                    !trimmed.startsWith('/*') &&
                    !trimmed.startsWith('*') &&
                    !trimmed.startsWith('public class') &&
                    !trimmed.startsWith('class ') &&
                    !trimmed.startsWith('public static void main') &&
                    !trimmed.startsWith('if') &&
                    !trimmed.startsWith('for') &&
                    !trimmed.startsWith('while') &&
                    !trimmed.startsWith('else')
                ) {
                    diagnostics.push({
                        line: lineNum,
                        type: 'error',
                        message: 'Possível falta de ponto e vírgula (;) no final da linha.'
                    });
                    errorLinesSet.add(lineNum);
                }
            });

            if (!code.includes('main') && code.trim() !== '') {
                diagnostics.push({
                    line: 0,
                    type: 'warning',
                    message: 'Aviso: O método "public static void main" não foi encontrado.'
                });
            }

            errorCountBadge.innerText = diagnostics.filter(d => d.type === 'error').length;
            
            if (diagnostics.length === 0) {
                diagnosticsList.innerHTML = '<div style="color: #6a9955; font-style: italic;">Nenhum erro estrutural detectado.</div>';
            } else {
                let html = '';
                diagnostics.forEach(diag => {
                    const isWarn = diag.type === 'warning';
                    html += `
                        <div class="diagnostic-item ${isWarn ? 'warning' : ''}">
                            ${diag.line > 0 ? `<div class="diag-line">Linha ${diag.line}</div>` : ''}
                            <div>${diag.message}</div>
                        </div>
                    `;
                });
                diagnosticsList.innerHTML = html;
            }

            const numSpans = lineNumbers.getElementsByTagName('span');
            for (let i = 0; i < numSpans.length; i++) {
                if (errorLinesSet.has(i + 1)) {
                    numSpans[i].classList.add('error-line-num');
                } else {
                    numSpans[i].classList.remove('error-line-num');
                }
            }
        }

        // --- EXECUÇÃO ROBUSTA VIA PISTON API ---
        async function runJavaCode() {
            const code = codeEditor.value;
            consoleOutput.innerText = "⏳ Compilando e executando via API Piston...";
            runBtn.disabled = true;

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: "java",
                        version: "15.0.2",
                        files: [
                            {
                                name: "Main.java",
                                content: code
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error("Erro HTTP: " + response.status);
                }

                const result = await response.json();
                
                // Tratamento seguro para diferentes versões do payload de retorno da API
                const outputObj = result.run || result;
                
                let output = "";
                if (outputObj.stdout) output += outputObj.stdout;
                if (outputObj.stderr) output += "\n[ERRO DE COMPILAÇÃO / EXECUÇÃO]:\n" + outputObj.stderr;
                if (outputObj.output && !output) output += outputObj.output;

                consoleOutput.innerText = output.trim() || "Código executado com sucesso (sem saída no console).";
            } catch (err) {
                consoleOutput.innerText = "Erro ao conectar com a API de execução. Verifique a sua conexão com a internet.";
            } finally {
                runBtn.disabled = false;
            }
        }

        updateLineNumbers();
        runSmartLinter();
    </script>
</body>
</html>
