<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoNexus Maps - Completo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-main: #202124;
            --text-muted: #5f6368;
            --accent: #1a73e8;
            --accent-hover: #1557b0;
            --border: #dadce0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        aside {
            width: 420px;
            height: 100%;
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo-area i {
            font-size: 24px;
            color: var(--accent);
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            background: var(--bg-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
        }

        .tools-section {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.8px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: #e8f0fe;
            border-color: var(--accent);
            color: var(--accent);
        }

        .category-btn i {
            color: var(--accent);
        }

        /* Seletor de Veículos */
        .vehicle-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .vehicle-option {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .vehicle-option.active {
            border-color: var(--accent);
            background: #e8f0fe;
            color: var(--accent);
        }

        .vehicle-option i {
            font-size: 18px;
        }

        .route-action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .route-action-btn:hover {
            background: var(--accent-hover);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            z-index: 1;
            position: relative;
        }

        /* Botão Flutuante de Geolocalização */
        .geo-fab {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            color: var(--accent);
            font-size: 20px;
            transition: all 0.2s;
        }

        .geo-fab:hover {
            background: var(--bg-secondary);
            transform: scale(1.05);
        }

        /* Marcadores Vetoriais */
        .vector-marker {
            background: transparent;
            border: none;
        }

        .marker-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .user-marker-icon {
            background: #34a853 !important;
        }

        @media(max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            aside {
                width: 100%;
                height: 50vh;
            }
            #map {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="logo-area">
                <i class="fa-solid fa-earth-americas"></i>
                <h1>GeoNexus Complete</h1>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar lugar (ex: Av Paulista, SP)..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="tools-section">
            <p class="section-title">Escolher Veículo para Rota</p>
            <div class="vehicle-selector">
                <div class="vehicle-option active" id="mode-car" onclick="setTravelMode('car', this)">
                    <i class="fa-solid fa-car"></i> Carro
                </div>
                <div class="vehicle-option" id="mode-bike" onclick="setTravelMode('bike', this)">
                    <i class="fa-solid fa-bicycle"></i> Bicicleta
                </div>
                <div class="vehicle-option" id="mode-walk" onclick="setTravelMode('walk', this)">
                    <i class="fa-solid fa-person-walking"></i> A pé
                </div>
            </div>

            <button class="route-action-btn" onclick="startRouteToSearchedPlace()">
                <i class="fa-solid fa-route"></i> Traçar Rota Até o Destino
            </button>

            <p class="section-title" style="margin-top: 25px;">Explorar Capitais</p>
            <div class="category-grid">
                <button class="category-btn" onclick="moveTo(-23.5505, -46.6333, 13, 'São Paulo')">
                    <i class="fa-solid fa-city"></i> São Paulo
                </button>
                <button class="category-btn" onclick="moveTo(-22.9068, -43.1729, 13, 'Rio de Janeiro')">
                    <i class="fa-solid fa-umbrella-beach"></i> Rio
                </button>
                <button class="category-btn" onclick="moveTo(-25.4284, -49.2733, 13, 'Curitiba')">
                    <i class="fa-solid fa-tree-city"></i> Curitiba
                </button>
                <button class="category-btn" onclick="moveTo(-15.7801, -47.9292, 13, 'Brasília')">
                    <i class="fa-solid fa-landmark"></i> Brasília
                </button>
            </div>
        </div>
    </aside>

    <main id="map">
        <button class="geo-fab" onclick="centerOnUserLocation()" title="Centralizar na minha localização">
            <i class="fa-solid fa-crosshairs"></i>
        </button>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // Inicialização do mapa
        const map = L.map('map').setView([-23.5505, -46.6333], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let userCoords = null;
        let userMarker = null;
        let searchedCoords = null;
        let searchedMarker = null;
        let routingControl = null;
        let currentTravelMode = 'driving'; // Padrão OSRM para carro ('driving', 'cycling', 'walking')

        // Ícones Vetoriais Personalizados
        const defaultIcon = L.divIcon({
            className: 'vector-marker',
            html: '<div class="marker-icon"><i class="fa-solid fa-star"></i></div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        const userIcon = L.divIcon({
            className: 'vector-marker',
            html: '<div class="marker-icon user-marker-icon"><i class="fa-solid fa-user"></i></div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        // 1. Geolocalização em Tempo Real do Usuário
        function initUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        userCoords = [lat, lng];

                        if (!userMarker) {
                            userMarker = L.marker(userCoords, { icon: userIcon })
                                .addTo(map)
                                .bindPopup('<b>Você está aqui</b>');
                        } else {
                            userMarker.setLatLng(userCoords);
                        }
                    },
                    (error) => {
                        console.warn('Erro ao obter geolocalização em tempo real:', error.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            }
        }
        initUserLocation();

        // Botão para centralizar instantaneamente onde o usuário está
        function centerOnUserLocation() {
            if (userCoords) {
                map.flyTo(userCoords, 16, { duration: 1.5 });
                userMarker.openPopup();
            } else {
                alert('Ainda obtendo sua posição atual. Certifique-se de permitir o acesso à localização.');
            }
        }

        // 2. Busca de Lugares via Nominatim API (OpenStreetMap)
        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value;
                if (!query) return;

                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const result = data[0];
                            const lat = parseFloat(result.lat);
                            const lng = parseFloat(result.lon);
                            searchedCoords = [lat, lng];

                            if (searchedMarker) {
                                map.removeLayer(searchedMarker);
                            }

                            searchedMarker = L.marker(searchedCoords, { icon: defaultIcon })
                                .addTo(map)
                                .bindPopup(`<b>${result.display_name}</b>`)
                                .openPopup();

                            map.flyTo(searchedCoords, 15, { duration: 1.5 });
                        } else {
                            alert('Local não encontrado.');
                        }
                    })
                    .catch(() => alert('Erro na busca do endereço.'));
            }
        }

        // 3. Escolher Veículo
        function setTravelMode(mode, element) {
            document.querySelectorAll('.vehicle-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            if (mode === 'car') currentTravelMode = 'driving';
            if (mode === 'bike') currentTravelMode = 'cycling';
            if (mode === 'walk') currentTravelMode = 'walking';
        }

        // 4. Iniciar Rota do Local do Usuário até o Destino Escolhido
        function startRouteToSearchedPlace() {
            if (!userCoords) {
                alert('Aguardando sua localização atual para iniciar a rota.');
                return;
            }
            if (!searchedCoords) {
                alert('Por favor, pesquise e selecione um destino na barra de pesquisa primeiro.');
                return;
            }

            if (routingControl) {
                map.removeControl(routingControl);
            }

            // Mapeia o perfil de roteamento OSRM correto
            let routerProfile = L.Routing.osrmv1({
                serviceUrl: 'https://router.project-osrm.org/route/v1',
                profile: currentTravelMode
            });

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userCoords[0], userCoords[1]),
                    L.latLng(searchedCoords[0], searchedCoords[1])
                ],
                router: routerProfile,
                lineOptions: {
                    styles: [{ color: '#1a73e8', weight: 6, opacity: 0.8 }]
                },
                createMarker: function() { return null; }, // Evita marcadores duplicados do plugin
                addWaypoints: false,
                fitSelectedRoutes: true,
                show: true
            }).addTo(map);
        }

        function moveTo(lat, lng, zoom) {
            map.flyTo([lat, lng], zoom, { duration: 2 });
        }
    </script>
</body>
</html>
