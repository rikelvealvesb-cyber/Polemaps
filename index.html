<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Bank | Banco Digital & Carteira Omni</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones modernos de banco -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Biblioteca Html5-Qrcode para leitura real de QR Code pela câmera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Container do App Mobile (Estilo Smartphone) -->
    <div class="w-full max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl overflow-hidden min-h-screen sm:min-h-[840px] flex flex-col border border-slate-800 relative">
        
        <!-- Barra Superior (Status Bar Simulada) -->
        <div class="bg-slate-900 px-6 py-3 flex justify-between items-center border-b border-slate-800/60">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-cube text-white text-sm"></i>
                </div>
                <span class="font-extrabold tracking-wide text-lg bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">OMNI BANK</span>
            </div>
            <div class="flex items-center gap-3 text-slate-400 text-xs font-medium bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="connection-status">Seguro</span>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="flex-1 flex flex-col p-6 overflow-y-auto">

            <!-- 1. TELA DE LOGIN / BIOMETRIA EXCLUSIVA -->
            <div id="auth-screen" class="flex-1 flex flex-col justify-between py-6">
                <div class="text-center space-y-3 mt-8">
                    <div class="w-20 h-20 bg-violet-600/10 border border-violet-500/20 rounded-3xl mx-auto flex items-center justify-center text-violet-400 text-3xl shadow-2xl mb-6">
                        <i class="fa-solid fa-fingerprint animate-pulse"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Acesso Bancário</h1>
                    <p class="text-slate-400 text-sm max-w-[260px] mx-auto">Utilize sua biometria digital para acessar sua conta Omni com total segurança.</p>
                </div>

                <div class="space-y-4 my-auto">
                    <button onclick="handleBiometricLogin()" class="w-full group relative bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold p-4 rounded-2xl shadow-xl shadow-indigo-600/20 transition-all duration-300 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-fingerprint text-2xl group-hover:scale-110 transition-transform"></i>
                        <span>Entrar com Digital</span>
                    </button>
                    <p id="auth-error" class="text-rose-400 text-xs text-center hidden"></p>
                </div>

                <div class="text-center text-xs text-slate-500">
                    <i class="fa-solid fa-shield-halved mr-1"></i> Criptografia Bancária de Ponta a Ponta
                </div>
            </div>

            <!-- 2. TELA DO DASHBOARD (BANCÁRIO) -->
            <div id="dashboard-screen" class="hidden flex-1 flex flex-col space-y-6">
                
                <!-- Card de Saldo Estilo Cartão Black -->
                <div class="relative bg-gradient-to-br from-slate-800 via-slate-800 to-slate-900 p-6 rounded-3xl border border-slate-700/80 shadow-xl overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-violet-500/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Conta Corrente Omni</span>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="user-key-display" class="text-xs font-mono text-violet-300 bg-violet-950/60 px-2.5 py-1 rounded-lg border border-violet-800/40">Carregando chave...</span>
                                <button onclick="copyKey()" class="text-slate-400 hover:text-white text-xs"><i class="fa-regular fa-copy"></i></button>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-2xl bg-slate-700/50 border border-slate-600/40 flex items-center justify-center text-violet-400">
                            <i class="fa-solid fa-building-columns"></i>
                        </div>
                    </div>
                    
                    <div class="space-y-1">
                        <span class="text-xs text-slate-400">Saldo Disponível</span>
                        <div class="flex items-baseline gap-2">
                            <h2 id="user-balance" class="text-3xl font-extrabold tracking-tight text-white">0,00</h2>
                            <span class="text-sm font-bold text-violet-400">Omni</span>
                        </div>
                    </div>
                </div>

                <!-- Ações Rápidas (Botões de Transação) -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="openTab('pay')" class="bg-slate-800 hover:bg-slate-700/80 p-4 rounded-2xl border border-slate-700/60 flex flex-col items-center justify-center gap-2 transition-all group">
                        <div class="w-12 h-12 rounded-xl bg-violet-600/10 text-violet-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-paper-plane text-lg"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-200">Transferir</span>
                    </button>
                    <button onclick="openTab('receive')" class="bg-slate-800 hover:bg-slate-700/80 p-4 rounded-2xl border border-slate-700/60 flex flex-col items-center justify-center gap-2 transition-all group">
                        <div class="w-12 h-12 rounded-xl bg-emerald-600/10 text-emerald-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-qrcode text-lg"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-200">Receber / QR</span>
                    </button>
                </div>

                <!-- Área Dinâmica de Ações (Transferência / QR Scanner) -->
                <div id="action-area" class="bg-slate-800/60 p-5 rounded-3xl border border-slate-700/50 space-y-4">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-violet-400"></i> Transferir Omni
                    </h3>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Chave Pay do Destinatário</label>
                            <input type="text" id="target-key" placeholder="Ex: omni_8f7b3c2a1e..." class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Quantidade (Omni)</label>
                            <input type="number" id="pay-amount" placeholder="0.00" class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-semibold text-violet-300">
                        </div>
                        <button onclick="makePayment()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold p-3.5 rounded-xl transition shadow-lg shadow-violet-600/20 text-sm flex items-center justify-center gap-2">
                            <span>Confirmar Transferência</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>

                    <!-- Div do Leitor de Câmera (Inicialmente Oculta) -->
                    <div id="reader-container" class="hidden space-y-3 pt-2">
                        <div id="reader" class="w-full rounded-2xl overflow-hidden border border-slate-700"></div>
                        <button onclick="stopScanner()" class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 p-2.5 rounded-xl text-xs font-semibold">Fechar Câmera</button>
                    </div>
                </div>

                <!-- Botão de Sair / Bloquear Sessão -->
                <div class="pt-2">
                    <button onclick="logout()" class="w-full text-slate-500 hover:text-rose-400 text-xs font-medium transition py-2 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-lock"></i> Bloquear Sessão Bancária
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de Lógica do Sistema Bancário Omni -->
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCTkqOuXy5kHgN9Nrj9--Dooh8cuguYxPE",
            authDomain: "subjectrobot-49600.firebaseapp.com",
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com",
            projectId: "subjectrobot-49600",
            storageBucket: "subjectrobot-49600.appspot.com",
            messagingSenderId: "731604558049",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentCredentialId = null;
        let currentUserKey = null;
        let html5QrCode = null;

        // Gerar chave pay aleatória única no formato do banco
        function generateOmniKey() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let key = 'omni_';
            for (let i = 0; i < 12; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        // Login por Biometria otimizado
        async function handleBiometricLogin() {
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            let userId = null;

            if (window.PublicKeyCredential && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                try {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);

                    const credential = await navigator.credentials.get({
                        publicKey: {
                            challenge: challenge,
                            timeout: 30000,
                            userVerification: "required"
                        }
                    });

                    if (credential) {
                        userId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
                    }
                } catch (error) {
                    console.log("Biometria física não configurada, usando ID seguro local do aparelho.");
                }
            }

            // Fallback seguro se não houver biometria ativa ou hardware compatível no ambiente local
            if (!userId) {
                userId = localStorage.getItem('omni_device_id');
                if (!userId) {
                    userId = 'omni_user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    localStorage.setItem('omni_device_id', userId);
                }
            }

            currentCredentialId = userId;
            checkOrCreateAccount(userId);
        }

        // Verificar se a conta existe no Firebase, se não, criar com 100 Omni e chave gerada
        function checkOrCreateAccount(credId) {
            const sanitizedId = credId.replace(/[.#$\/\[\]]/g, '_');
            const userRef = db.ref('bank_users/' + sanitizedId);

            userRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    currentUserKey = userData.key;
                    loadDashboard(userData.balance, userData.key);
                } else {
                    const newKey = generateOmniKey();
                    const initialData = {
                        balance: 100,
                        key: newKey,
                        createdAt: Date.now()
                    };

                    userRef.set(initialData, (error) => {
                        if (!error) {
                            currentUserKey = newKey;
                            loadDashboard(100, newKey);
                            alert("Bem-vindo ao Omni Bank! Conta criada com sucesso e 100 Omni depositados como bônus.");
                        } else {
                            alert("Erro ao conectar com o banco de dados.");
                        }
                    });
                }
            });
        }

        function loadDashboard(balance, key) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('user-balance').innerText = balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('user-key-display').innerText = key;
        }

        function copyKey() {
            if (currentUserKey) {
                navigator.clipboard.writeText(currentUserKey);
                alert("Chave Pay copiada para a área de transferência!");
            }
        }

        function openTab(tab) {
            const actionArea = document.getElementById('action-area');
            if (tab === 'pay') {
                stopScanner();
                actionArea.innerHTML = `
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-violet-400"></i> Transferir Omni
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Chave Pay do Destinatário</label>
                            <input type="text" id="target-key" placeholder="Ex: omni_8f7b3c2a1e..." class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Quantidade (Omni)</label>
                            <input type="number" id="pay-amount" placeholder="0.00" class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-semibold text-violet-300">
                        </div>
                        <button onclick="makePayment()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold p-3.5 rounded-xl transition shadow-lg shadow-violet-600/20 text-sm flex items-center justify-center gap-2">
                            <span>Confirmar Transferência</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                `;
            } else if (tab === 'receive') {
                actionArea.innerHTML = `
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-qrcode text-emerald-400"></i> Receber via QR Code ou Câmera
                    </h3>
                    <p class="text-xs text-slate-400">Compartilhe sua chave abaixo ou use a câmera para escanear outro usuário:</p>
                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 text-center space-y-3">
                        <div class="bg-white p-3 inline-block rounded-xl">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${currentUserKey}" alt="QR Code" class="mx-auto rounded-lg">
                        </div>
                        <div class="font-mono text-xs text-violet-300 bg-slate-800 p-2 rounded-lg">${currentUserKey}</div>
                    </div>
                    <button onclick="startScanner()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold p-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-camera"></i>
                        <span>Escanear QR Code com Câmera</span>
                    </button>
                    <div id="reader-container" class="hidden space-y-3 pt-2">
                        <div id="reader" class="w-full rounded-2xl overflow-hidden border border-slate-700"></div>
                        <button onclick="stopScanner()" class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 p-2.5 rounded-xl text-xs font-semibold">Fechar Câmera</button>
                    </div>
                `;
            }
        }

        // Realizar pagamento buscando pelo Firebase e atualizando saldos de forma atômica
        function makePayment() {
            const targetKey = document.getElementById('target-key').value.trim();
            const amount = parseFloat(document.getElementById('pay-amount').value);

            if (!targetKey || isNaN(amount) || amount <= 0) {
                alert("Informe uma chave válida e um valor maior que zero.");
                return;
            }

            if (targetKey === currentUserKey) {
                alert("Você não pode transferir para sua própria chave.");
                return;
            }

            const sanitizedSenderId = currentCredentialId.replace(/[.#$\/\[\]]/g, '_');
            const rootRef = db.ref();

            rootRef.transaction((currentData) => {
                if (!currentData || !currentData.bank_users) {
                    return;
                }

                let senderPath = null;
                let receiverPath = null;

                for (let uid in currentData.bank_users) {
                    if (uid === sanitizedSenderId) senderPath = uid;
                    if (currentData.bank_users[uid].key === targetKey) receiverPath = uid;
                }

                if (!senderPath) {
                    alert("Erro: Conta do remetente não localizada.");
                    return;
                }

                if (!receiverPath) {
                    alert("Chave Pay do destinatário não encontrada no sistema Omni!");
                    return;
                }

                let senderBalance = currentData.bank_users[senderPath].balance;
                if (senderBalance < amount) {
                    alert("Saldo Omni insuficiente para realizar esta transferência.");
                    return;
                }

                currentData.bank_users[senderPath].balance -= amount;
                currentData.bank_users[receiverPath].balance += amount;

                return currentData;
            }, (error, committed, snapshot) => {
                if (committed) {
                    alert("Transferência realizada com sucesso!");
                    location.reload();
                } else if (error) {
                    alert("Erro na transação: " + error);
                }
            });
        }

        // Leitor de QR Code integrado com a câmera usando html5-qrcode
        function startScanner() {
            const container = document.getElementById('reader-container');
            container.classList.remove('hidden');

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    stopScanner();
                    openTab('pay');
                    setTimeout(() => {
                        document.getElementById('target-key').value = decodedText;
                        alert("QR Code escaneado com sucesso! Chave inserida.");
                    }, 200);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Não foi possível acessar a câmera do dispositivo.");
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            }
            const container = document.getElementById('reader-container');
            if (container) container.classList.add('hidden');
        }

        function logout() {
            stopScanner();
            location.reload();
        }
    </script>
</body>
</html>
