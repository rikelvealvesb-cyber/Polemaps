<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusSheet - A Planilha Inteligente</title>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-toolbar: #2d2d2d;
            --border-color: #3f3f46;
            --text-primary: #d4d4d4;
            --text-accent: #3b82f6;
            --cell-hover: #2a2d2e;
            --cell-select: #094771;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .app-header {
            display: flex;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .logo {
            margin-right: 24px;
            color: var(--text-accent);
        }

        .menu-bar span {
            margin-right: 16px;
            cursor: pointer;
            color: #9ca3af;
        }

        .menu-bar span.active, .menu-bar span:hover {
            color: var(--text-primary);
        }

        .toolbar {
            display: flex;
            align-items: center;
            background-color: var(--bg-toolbar);
            padding: 6px 12px;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .toolbar button, .toolbar label {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar button:hover, .toolbar label:hover {
            background-color: var(--border-color);
        }

        .toolbar input[type="color"] {
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            background: none;
        }

        .toolbar .separator {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            margin: 0 4px;
        }

        .formula-bar {
            display: flex;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        #current-cell-indicator {
            font-weight: bold;
            min-width: 35px;
            text-align: center;
            color: var(--text-accent);
        }

        .formula-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: var(--bg-primary);
        }

        table.spreadsheet {
            border-collapse: collapse;
            table-layout: fixed;
        }

        table.spreadsheet th, table.spreadsheet td {
            border: 1px solid var(--border-color);
            height: 28px;
            width: 100px;
            padding: 2px 4px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        table.spreadsheet th {
            background-color: var(--bg-secondary);
            text-align: center;
            color: #9ca3af;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table.spreadsheet th.row-header {
            position: sticky;
            left: 0;
            z-index: 3;
            width: 50px;
        }

        table.spreadsheet td {
            background-color: var(--bg-primary);
            cursor: cell;
        }

        table.spreadsheet td.selected {
            outline: 2px solid var(--text-accent);
            background-color: var(--cell-select) !important;
            z-index: 1;
        }

        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 4px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
        }

        .sheet-tabs {
            display: flex;
            gap: 4px;
        }

        .tab {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
        }

        .tab.active {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border-top: 2px solid var(--text-accent);
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Menu Superior -->
        <header class="app-header">
            <div class="logo"><i class="fa-solid fa-layer-group"></i> <strong>NexusSheet</strong></div>
            <nav class="menu-bar">
                <span>Arquivo</span>
                <span id="menu-export" style="cursor:pointer;"><i class="fa-solid fa-download"></i> Exportar CSV</span>
                <span>Editar</span>
                <span class="active">Dados & IA</span>
            </nav>
        </header>

        <!-- Barra de Ferramentas Avançadas -->
        <div class="toolbar">
            <button id="btn-fetch" title="Buscar dados de API externa"><i class="fa-solid fa-globe"></i> API Fetch</button>
            <button id="btn-history" title="Ver histórico da célula"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</button>
            <span class="separator"></span>
            <button id="btn-bold" title="Negrito"><i class="fa-solid fa-bold"></i></button>
            <button id="btn-italic" title="Itálico"><i class="fa-solid fa-italic"></i></button>
            <label title="Cor de Fundo da Célula"><i class="fa-solid fa-fill-drip"></i> <input type="color" id="cell-bg-color" value="#1e1e1e"></label>
            <span class="separator"></span>
            <button id="btn-clear" title="Limpar Célula"><i class="fa-solid fa-trash-can"></i> Limpar</button>
        </div>

        <!-- Barra de Fórmulas -->
        <div class="formula-bar">
            <span id="current-cell-indicator">A1</span>
            <i class="fa-solid fa-fx"></i>
            <input type="text" id="formula-input" placeholder="Digite valor, fórmula (=A1+B1), =SUM(A1:A5) ou =FETCH(...)">
        </div>

        <!-- Grade da Planilha -->
        <div class="grid-container" id="grid-container"></div>

        <!-- Rodapé -->
        <footer class="app-footer">
            <div class="sheet-tabs">
                <button class="tab active">Planilha 1</button>
            </div>
            <div class="status-bar" id="status-bar">Pronto | Auto-save Ativo</div>
        </footer>
    </div>

    <script>
        // --- Core Engine e Estado ---
        class NexusSheetEngine {
            constructor() {
                this.rows = 60;
                this.cols = 26;
                this.data = JSON.parse(localStorage.getItem('nexus_sheet_data')) || {};
                this.cellHistory = JSON.parse(localStorage.getItem('nexus_sheet_history')) || {};
                this.activeCellId = 'A1';
            }

            saveState() {
                localStorage.setItem('nexus_sheet_data', JSON.stringify(this.data));
                localStorage.setItem('nexus_sheet_history', JSON.stringify(this.cellHistory));
            }

            setCell(cellId, value, formula = '', style = {}) {
                if (!this.data[cellId]) {
                    this.data[cellId] = { value: '', formula: '', style: {} };
                }
                const oldVal = this.data[cellId].value;
                
                this.data[cellId].value = value;
                if (formula !== undefined) this.data[cellId].formula = formula;
                if (style) {
                    this.data[cellId].style = { ...this.data[cellId].style, ...style };
                }

                // Registrar Histórico
                if (oldVal !== value) {
                    if (!this.cellHistory[cellId]) this.cellHistory[cellId] = [];
                    this.cellHistory[cellId].push({
                        oldValue: oldVal,
                        newValue: value,
                        timestamp: new Date().toLocaleTimeString()
                    });
                }

                this.saveState();
            }

            getCell(cellId) {
                return this.data[cellId] || { value: '', formula: '', style: {} };
            }

            clearCell(cellId) {
                if (this.data[cellId]) {
                    delete this.data[cellId];
                    this.saveState();
                }
            }
        }

        const engine = new NexusSheetEngine();

        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('grid-container');
            const currentCellIndicator = document.getElementById('current-cell-indicator');
            const formulaInput = document.getElementById('formula-input');
            const statusBar = document.getElementById('status-bar');

            let activeCellElement = null;

            function buildGrid() {
                const table = document.createElement('table');
                table.className = 'spreadsheet';

                // Cabeçalho colunas (A-Z)
                const headerRow = document.createElement('tr');
                const thCorner = document.createElement('th');
                thCorner.className = 'row-header';
                headerRow.appendChild(thCorner);

                for (let c = 0; c < engine.cols; c++) {
                    const th = document.createElement('th');
                    th.textContent = String.fromCharCode(65 + c);
                    headerRow.appendChild(th);
                }
                table.appendChild(headerRow);

                // Linhas
                for (let r = 1; r <= engine.rows; r++) {
                    const tr = document.createElement('tr');
                    const thRow = document.createElement('th');
                    thRow.className = 'row-header';
                    thRow.textContent = r;
                    tr.appendChild(thRow);

                    for (let c = 0; c < engine.cols; c++) {
                        const td = document.createElement('td');
                        const colLetter = String.fromCharCode(65 + c);
                        const cellId = `${colLetter}${r}`;
                        td.id = cellId;
                        td.contentEditable = true;

                        // Restaurar dados salvos
                        const cellInfo = engine.getCell(cellId);
                        if (cellInfo.value !== '') {
                            td.textContent = cellInfo.value;
                        }
                        applyStylesToElement(td, cellInfo.style);

                        // Eventos
                        td.addEventListener('focus', () => selectCell(td, cellId));
                        td.addEventListener('input', (e) => handleInput(cellId, e.target.textContent));
                        td.addEventListener('keydown', (e) => handleKeyNavigation(e, colLetter, r));

                        tr.appendChild(td);
                    }
                    table.appendChild(tr);
                }

                gridContainer.appendChild(table);
                
                // Selecionar A1 por padrão
                const firstCell = document.getElementById('A1');
                if (firstCell) selectCell(firstCell, 'A1');
            }

            function selectCell(td, cellId) {
                if (activeCellElement) activeCellElement.classList.remove('selected');
                activeCellElement = td;
                activeCellElement.classList.add('selected');
                engine.activeCellId = cellId;
                
                currentCellIndicator.textContent = cellId;
                const cellInfo = engine.getCell(cellId);
                formulaInput.value = cellInfo.formula || cellInfo.value;
                statusBar.textContent = `Célula ativa: ${cellId} | Pronto`;
            }

            function applyStylesToElement(element, style) {
                if (!element) return;
                if (style.bold) element.style.fontWeight = 'bold';
                else element.style.fontWeight = 'normal';

                if (style.italic) element.style.fontStyle = 'italic';
                else element.style.fontStyle = 'normal';

                if (style.backgroundColor) element.style.backgroundColor = style.backgroundColor;
            }

            async function handleInput(cellId, rawValue) {
                let computedValue = rawValue;
                let formulaText = rawValue;

                if (rawValue.startsWith('=')) {
                    computedValue = await evaluateFormula(rawValue);
                }

                engine.setCell(cellId, computedValue, formulaText);
                
                // Se a fórmula gerou valor diferente, atualiza visualmente sem perder o cursor
                if (rawValue.startsWith('=') && activeCellElement && activeCellElement.id === cellId) {
                    // Mantém a visualização limpa
                }
            }

            // Engine de Avaliação de Fórmulas Avançada (Substitui referências como A1, B2)
            async function evaluateFormula(formula) {
                try {
                    let cleanFormula = formula.substring(1).trim();

                    // 1. Tratamento de API =FETCH("url", "path")
                    if (cleanFormula.toUpperCase().startsWith('FETCH(')) {
                        const match = cleanFormula.match(/FETCH\("(.*?)"(?:,\s*"(.*?)")?\)/i);
                        if (match) {
                            const res = await fetch(match[1]);
                            const data = await res.json();
                            if (match[2]) {
                                return match[2].split('.').reduce((o, k) => o?.[k], data) ?? 'Erro Chave';
                            }
                            return JSON.stringify(data);
                        }
                        return '#SINTAXE_FETCH';
                    }

                    // 2. Tratamento de Funções de Intervalo (=SUM(A1:A5))
                    if (cleanFormula.toUpperCase().startsWith('SUM(')) {
                        const rangeMatch = cleanFormula.match(/SUM\(([A-Z]+[0-9]+):([A-Z]+[0-9]+)\)/i);
                        if (rangeMatch) {
                            const vals = getRangeValues(rangeMatch[1], rangeMatch[2]);
                            return vals.reduce((acc, v) => acc + (parseFloat(v) || 0), 0);
                        }
                    }

                    // 3. Substituir referências de células (ex: A1, B2) pelos seus valores reais
                    cleanFormula = cleanFormula.replace(/[A-Z]+[0-9]+/g, (match) => {
                        const val = engine.getCell(match).value;
                        return isNaN(val) || val === '' ? 0 : val;
                    });

                    // Execução segura via eval aritmético básico
                    const result = eval(cleanFormula);
                    return result !== undefined ? result : '#ERRO';
                } catch (e) {
                    return '#FÓRMULA_ERRO';
                }
            }

            function getRangeValues(startId, endId) {
                const colStart = startId.match(/[A-Z]+/)[0];
                const rowStart = parseInt(startId.match(/[0-9]+/)[0]);
                const colEnd = endId.match(/[A-Z]+/)[0];
                const rowEnd = parseInt(endId.match(/[0-9]+/)[0]);

                let values = [];
                for (let r = rowStart; r <= rowEnd; r++) {
                    for (let c = colStart.charCodeAt(0); c <= colEnd.charCodeAt(0); c++) {
                        const id = `${String.fromCharCode(c)}${r}`;
                        values.push(engine.getCell(id).value);
                    }
                }
                return values;
            }

            // Navegação por teclado estilo Excel
            function handleKeyNavigation(e, colLetter, rowNum) {
                let targetRow = rowNum;
                let targetColCode = colLetter.charCodeAt(0);

                if (e.key === 'Enter') {
                    e.preventDefault();
                    targetRow = Math.min(engine.rows, rowNum + 1);
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    targetColCode = Math.min(65 + engine.cols - 1, targetColCode + 1);
                } else if (e.key === 'ArrowDown') {
                    targetRow = Math.min(engine.rows, rowNum + 1);
                } else if (e.key === 'ArrowUp') {
                    targetRow = Math.max(1, rowNum - 1);
                } else if (e.key === 'ArrowRight') {
                    targetColCode = Math.min(65 + engine.cols - 1, targetColCode + 1);
                } else if (e.key === 'ArrowLeft') {
                    targetColCode = Math.max(65, targetColCode - 1);
                } else {
                    return;
                }

                const nextCellId = `${String.fromCharCode(targetColCode)}${targetRow}`;
                const nextCellEl = document.getElementById(nextCellId);
                if (nextCellEl) {
                    nextCellEl.focus();
                }
            }

            // Sincronizar input da barra superior com a célula ativa
            formulaInput.addEventListener('input', (e) => {
                if (activeCellElement) {
                    activeCellElement.textContent = e.target.value;
                    handleInput(activeCellElement.id, e.target.value);
                }
            });

            // Botões da Toolbar
            document.getElementById('btn-fetch').addEventListener('click', () => {
                if (activeCellElement) {
                    const formula = '=FETCH("https://api.coinbase.com/v2/prices/BTC-BRL/spot", "data.amount")';
                    formulaInput.value = formula;
                    formulaInput.dispatchEvent(new Event('input'));
                }
            });

            document.getElementById('btn-bold').addEventListener('click', () => {
                if (activeCellElement) {
                    const info = engine.getCell(activeCellElement.id);
                    const isBold = !info.style.bold;
                    engine.setCell(activeCellElement.id, activeCellElement.textContent, undefined, { bold: isBold });
                    applyStylesToElement(activeCellElement, engine.getCell(activeCellElement.id).style);
                }
            });

            document.getElementById('btn-italic').addEventListener('click', () => {
                if (activeCellElement) {
                    const info = engine.getCell(activeCellElement.id);
                    const isItalic = !info.style.italic;
                    engine.setCell(activeCellElement.id, activeCellElement.textContent, undefined, { italic: isItalic });
                    applyStylesToElement(activeCellElement, engine.getCell(activeCellElement.id).style);
                }
            });

            document.getElementById('cell-bg-color').addEventListener('input', (e) => {
                if (activeCellElement) {
                    const color = e.target.value;
                    engine.setCell(activeCellElement.id, activeCellElement.textContent, undefined, { backgroundColor: color });
                    applyStylesToElement(activeCellElement, engine.getCell(activeCellElement.id).style);
                }
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                if (activeCellElement) {
                    engine.clearCell(activeCellElement.id);
                    activeCellElement.textContent = '';
                    formulaInput.value = '';
                }
            });

            document.getElementById('btn-history').addEventListener('click', () => {
                if (activeCellElement) {
                    const history = engine.cellHistory[activeCellElement.id] || [{ msg: 'Sem alterações registradas' }];
                    alert(`Histórico da célula ${activeCellElement.id}:\n` + JSON.stringify(history, null, 2));
                }
            });

            // Exportar CSV
            document.getElementById('menu-export').addEventListener('click', () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                for (let r = 1; r <= 20; r++) {
                    let row = [];
                    for (let c = 0; c < 10; c++) {
                        const id = `${String.fromCharCode(65 + c)}${r}`;
                        row.value = engine.getCell(id).value || '';
                        row.push(`"${row.value}"`);
                    }
                    csvContent += row.join(",") + "\r\n";
                }
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "nexus_sheet_export.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            buildGrid();
        });
    </script>
</body>
</html>
