<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Game & Bank | Mundo Aberto 3D e Carteira Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js para Gráficos 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Container do App Mobile (Estilo Smartphone) -->
    <div class="w-full max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl overflow-hidden min-h-screen sm:min-h-[880px] flex flex-col border border-slate-800 relative select-none">
        
        <!-- Barra Superior (Status Bar Simulada) -->
        <div class="bg-slate-900 px-6 py-3 flex justify-between items-center border-b border-slate-800/60 z-30">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gamepad text-white text-sm"></i>
                </div>
                <span class="font-extrabold tracking-wide text-lg bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">OMNI WORLD</span>
            </div>
            <div class="flex items-center gap-3 text-slate-400 text-xs font-medium bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="connection-status">Online</span>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="flex-1 flex flex-col overflow-y-auto relative pb-16">

            <!-- 1. TELA DE LOGIN / BIOMETRIA -->
            <div id="auth-screen" class="flex-1 flex flex-col justify-between p-6 py-12 z-20 bg-slate-900">
                <div class="text-center space-y-3 mt-8">
                    <div class="w-20 h-20 bg-violet-600/10 border border-violet-500/20 rounded-3xl mx-auto flex items-center justify-center text-violet-400 text-3xl shadow-2xl mb-6">
                        <i class="fa-solid fa-fingerprint animate-pulse"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Acesso ao Jogo</h1>
                    <p class="text-slate-400 text-sm max-w-[260px] mx-auto">Autentique com sua digital para carregar seu personagem e carteira Omni.</p>
                </div>

                <div class="space-y-4 my-auto">
                    <button onclick="handleBiometricAuth()" class="w-full group relative bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold p-4 rounded-2xl shadow-xl shadow-indigo-600/20 transition-all duration-300 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-fingerprint text-2xl group-hover:scale-110 transition-transform"></i>
                        <span>Entrar com Digital</span>
                    </button>
                    <p id="auth-error" class="text-rose-400 text-xs text-center hidden"></p>
                </div>

                <div class="text-center text-xs text-slate-500">
                    <i class="fa-solid fa-shield-halved mr-1"></i> Sincronizado via WebAuthn
                </div>
            </div>

            <!-- 2. TELA DO JOGO (MUNDO ABERTO 3D) -->
            <div id="game-screen" class="hidden flex-1 flex flex-col relative overflow-hidden bg-slate-950">
                <!-- Canvas do Jogo 3D (Three.js) -->
                <div id="game-container" class="absolute inset-0 w-full h-full"></div>

                <!-- HUD Superior dentro do Jogo -->
                <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-10 pointer-events-none">
                    <div class="bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-700/50 flex items-center gap-2">
                        <i class="fa-solid fa-wallet text-violet-400 text-xs"></i>
                        <span id="game-balance" class="text-xs font-extrabold text-white">0,00 Omni</span>
                    </div>
                </div>
            </div>

            <!-- 3. TELA DA CARTEIRA & BANCO -->
            <div id="wallet-screen" class="hidden p-6 space-y-6 flex-1">
                <div class="relative bg-gradient-to-br from-slate-800 via-slate-800 to-slate-900 p-6 rounded-3xl border border-slate-700/80 shadow-xl overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-violet-500/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Carteira Omni Game</span>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="user-key-display" class="text-xs font-mono text-violet-300 bg-violet-950/60 px-2.5 py-1 rounded-lg border border-violet-800/40">Carregando...</span>
                                <button onclick="copyKey()" class="text-slate-400 hover:text-white text-xs"><i class="fa-regular fa-copy"></i></button>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-2xl bg-slate-700/50 border border-slate-600/40 flex items-center justify-center text-violet-400">
                            <i class="fa-solid fa-coins"></i>
                        </div>
                    </div>
                    
                    <div class="space-y-1">
                        <span class="text-xs text-slate-400">Saldo Disponível</span>
                        <div class="flex items-baseline gap-2">
                            <h2 id="user-balance" class="text-3xl font-extrabold tracking-tight text-white">0,00</h2>
                            <span class="text-sm font-bold text-violet-400">Omni</span>
                        </div>
                    </div>
                </div>

                <!-- Transferência com Biometria -->
                <div class="bg-slate-800/60 p-5 rounded-3xl border border-slate-700/50 space-y-4">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-violet-400"></i> Enviar Omni para Outro Jogador
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Chave do Jogador</label>
                            <input type="text" id="target-key" placeholder="Ex: omni_..." class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Quantidade (Omni)</label>
                            <input type="number" id="pay-amount" placeholder="0.00" class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-violet-500 font-semibold text-violet-300">
                        </div>
                        <button onclick="confirmAndPay()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold p-3.5 rounded-xl transition shadow-lg shadow-violet-600/20 text-sm flex items-center justify-center gap-2">
                            <span>Confirmar com Digital e Enviar</span>
                            <i class="fa-solid fa-fingerprint text-base"></i>
                        </button>
                    </div>
                </div>

                <button onclick="logout()" class="w-full text-slate-500 hover:text-rose-400 text-xs font-medium transition py-2 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-lock"></i> Sair / Bloquear
                </button>
            </div>

        </div>

        <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
        <div id="bottom-nav" class="hidden bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 py-3 flex justify-around items-center z-30">
            <button onclick="switchTab('game')" id="nav-btn-game" class="flex flex-col items-center gap-1 text-violet-400 transition">
                <i class="fa-solid fa-gamepad text-lg"></i>
                <span class="text-[10px] font-semibold">Mundo 3D</span>
            </button>
            <button onclick="switchTab('wallet')" id="nav-btn-wallet" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[10px] font-semibold">Carteira</span>
            </button>
        </div>

    </div>

    <!-- Script Principal de Integração e Jogo 3D -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCTkqOuXy5kHgN9Nrj9--Dooh8cuguYxPE",
            authDomain: "subjectrobot-49600.firebaseapp.com",
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com",
            projectId: "subjectrobot-49600",
            storageBucket: "subjectrobot-49600.appspot.com",
            messagingSenderId: "731604558049",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentCredentialId = null;
        let currentUserKey = null;
        let sanitizedUserId = null;

        // Variáveis do Jogo 3D (Three.js)
        let scene, camera, renderer;
        let playerGroup;
        let leftLeg, rightLeg, leftArm, rightArm;
        let animStep = 0;
        let targetPosition = null;
        let otherPlayersMeshes = {};

        function generateOmniKey() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let key = 'omni_';
            for (let i = 0; i < 12; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
            return key;
        }

        async function verifyBiometrics() {
            if (!window.PublicKeyCredential) return true;
            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const credential = await navigator.credentials.get({
                    publicKey: { challenge: challenge, timeout: 60000, userVerification: "required" }
                });
                return credential !== null;
            } catch (err) {
                return false;
            }
        }

        async function handleBiometricAuth() {
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                let savedCredIdHex = localStorage.getItem('omni_cred_id');
                let credential = null;

                if (savedCredIdHex) {
                    try {
                        const rawIdBytes = new Uint8Array(savedCredIdHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                        credential = await navigator.credentials.get({
                            publicKey: { challenge: challenge, timeout: 60000, userVerification: "required", allowCredentials: [{ type: "public-key", id: rawIdBytes }] }
                        });
                    } catch (e) {}
                }

                if (!credential) {
                    const userIdRandom = new Uint8Array(16);
                    window.crypto.getRandomValues(userIdRandom);
                    credential = await navigator.credentials.create({
                        publicKey: {
                            challenge: challenge,
                            rp: { name: "Omni World Game" },
                            user: { id: userIdRandom, name: "jogador_omni", displayName: "Jogador Omni" },
                            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                            timeout: 60000
                        }
                    });
                    if (credential) {
                        const credIdHex = Array.from(new Uint8Array(credential.rawId)).map(b => b.toString(16).padStart(2, '0')).join('');
                        localStorage.setItem('omni_cred_id', credIdHex);
                    }
                }

                if (credential) {
                    currentCredentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
                    checkOrCreateAccount(currentCredentialId);
                }
            } catch (error) {
                errorEl.innerText = "Falha na autenticação biométrica.";
                errorEl.classList.remove('hidden');
            }
        }

        function checkOrCreateAccount(credId) {
            sanitizedUserId = credId.replace(/[.#$\/\[\]]/g, '_');
            const userRef = db.ref('bank_users/' + sanitizedUserId);

            userRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    currentUserKey = userData.key;
                    loadDashboard(userData.balance, userData.key);
                } else {
                    const newKey = generateOmniKey();
                    userRef.set({ balance: 500, key: newKey, createdAt: Date.now() }, (error) => {
                        if (!error) {
                            currentUserKey = newKey;
                            loadDashboard(500, newKey);
                        }
                    });
                }
            });
        }

        function loadDashboard(balance, key) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            
            document.getElementById('user-balance').innerText = balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('game-balance').innerText = balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + " Omni";
            document.getElementById('user-key-display').innerText = key;

            db.ref('bank_users/' + sanitizedUserId + '/balance').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const val = snapshot.val().toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                    document.getElementById('user-balance').innerText = val;
                    document.getElementById('game-balance').innerText = val + " Omni";
                }
            });

            init3DWorld();
            initTouchMovement();
            initMultiplayerSync();
        }

        function switchTab(tabName) {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('wallet-screen').classList.add('hidden');
            document.getElementById('nav-btn-game').className = "flex flex-col items-center gap-1 text-slate-400 transition";
            document.getElementById('nav-btn-wallet').className = "flex flex-col items-center gap-1 text-slate-400 transition";

            if (tabName === 'game') {
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('nav-btn-game').className = "flex flex-col items-center gap-1 text-violet-400 transition";
            } else {
                document.getElementById('wallet-screen').classList.remove('hidden');
                document.getElementById('nav-btn-wallet').className = "flex flex-col items-center gap-1 text-violet-400 transition";
            }
        }

        function copyKey() {
            if (currentUserKey) {
                navigator.clipboard.writeText(currentUserKey);
                alert("Chave copiada!");
            }
        }

        // --- MOTOR GRÁFICO 3D (THREE.JS) ---
        function init3DWorld() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 8, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            playerGroup = createCharacterMesh();
            playerGroup.position.set(0, 0, 3);
            scene.add(playerGroup);
            targetPosition = playerGroup.position.clone();

            animateGame();
        }

        // Criar Boneco Completo com Olhos (Branco com ponto preto)
        function createCharacterMesh() {
            const group = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d });
            const clothesMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x451a03 });
            const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const eyeBlackMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

            // Cabeça e Cabelo
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
            head.position.y = 1.4;
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.15, 0.42), hairMat);
            hair.position.set(0, 1.62, 0);

            // Olhos (Fundo branco e ponto preto)
            const leftEyeWhite = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), eyeWhiteMat);
            leftEyeWhite.position.set(-0.1, 1.4, 0.21);
            const leftPupil = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.06), eyeBlackMat);
            leftPupil.position.set(-0.1, 1.4, 0.22);

            const rightEyeWhite = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), eyeWhiteMat);
            rightEyeWhite.position.set(0.1, 1.4, 0.21);
            const rightPupil = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.06), eyeBlackMat);
            rightPupil.position.set(0.1, 1.4, 0.22);

            group.add(head, hair, leftEyeWhite, leftPupil, rightEyeWhite, rightPupil);

            // Tronco
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), clothesMat);
            torso.position.y = 0.9;
            group.add(torso);

            // Braços
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), clothesMat);
            lArm.position.set(-0.35, 0.9, 0);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), clothesMat);
            rArm.position.set(0.35, 0.9, 0);
            group.add(lArm, rArm);

            // Pernas
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), pantsMat);
            lLeg.position.set(-0.15, 0.3, 0);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), pantsMat);
            rLeg.position.set(0.15, 0.3, 0);
            group.add(lLeg, rLeg);

            group.userData = { lLeg, rLeg, lArm, rArm };
            return group;
        }

        // Toque na tela para mover o personagem até a posição
        function initTouchMovement() {
            const container = document.getElementById('game-container');
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

            container.addEventListener('pointerdown', (e) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const targetPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, targetPoint);

                if (targetPoint) {
                    targetPosition.set(targetPoint.x, 0, targetPoint.z);
                }
            });
        }

        // Loop de Animação e Sincronização do Jogador
        function animateGame() {
            requestAnimationFrame(animateGame);

            if (playerGroup && targetPosition) {
                const dir = new THREE.Vector3().subVectors(targetPosition, playerGroup.position);
                const dist = dir.length();

                if (dist > 0.1) {
                    dir.normalize();
                    playerGroup.position.addScaledVector(dir, 0.08);
                    playerGroup.lookAt(targetPosition.x, playerGroup.position.y, targetPosition.z);

                    // Animação de caminhada idêntica mantida
                    animStep += 0.2;
                    if (playerGroup.userData.lLeg) {
                        playerGroup.userData.lLeg.rotation.x = Math.sin(animStep) * 0.5;
                        playerGroup.userData.rLeg.rotation.x = -Math.sin(animStep) * 0.5;
                        playerGroup.userData.lArm.rotation.x = -Math.sin(animStep) * 0.5;
                        playerGroup.userData.rArm.rotation.x = Math.sin(animStep) * 0.5;
                    }

                    // Enviar posição atual para o Firebase
                    if (Math.random() < 0.3) {
                        db.ref('game_players/' + sanitizedUserId).set({
                            x: playerGroup.position.x,
                            y: playerGroup.position.y,
                            z: playerGroup.position.z,
                            rotY: playerGroup.rotation.y
                        });
                    }
                } else {
                    if (playerGroup.userData.lLeg) {
                        playerGroup.userData.lLeg.rotation.x = 0;
                        playerGroup.userData.rLeg.rotation.x = 0;
                        playerGroup.userData.lArm.rotation.x = 0;
                        playerGroup.userData.rArm.rotation.x = 0;
                    }
                }

                // Câmera sempre acompanha o jogador por onde ele andar
                camera.position.set(playerGroup.position.x, playerGroup.position.y + 6, playerGroup.position.z + 10);
                camera.lookAt(playerGroup.position);
            }

            renderer.render(scene, camera);
        }

        // Sincronizar demais jogadores no mapa
        function initMultiplayerSync() {
            const playersRef = db.ref('game_players');
            playersRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                Object.keys(data).forEach((uid) => {
                    if (uid === sanitizedUserId) return;
                    const pData = data[uid];

                    if (!otherPlayersMeshes[uid]) {
                        const mesh = createCharacterMesh();
                        scene.add(mesh);
                        otherPlayersMeshes[uid] = mesh;
                    }

                    const otherMesh = otherPlayersMeshes[uid];
                    otherMesh.position.set(pData.x, pData.y, pData.z);
                    otherMesh.rotation.y = pData.rotY;
                });

                // Remover jogadores desconectados
                Object.keys(otherPlayersMeshes).forEach((uid) => {
                    if (!data[uid]) {
                        scene.remove(otherPlayersMeshes[uid]);
                        delete otherPlayersMeshes[uid];
                    }
                });
            });
        }

        // --- SISTEMA DE TRANSFERÊNCIA BANCÁRIA ---
        async function confirmAndPay() {
            const targetKey = document.getElementById('target-key').value.trim();
            const amount = parseFloat(document.getElementById('pay-amount').value);

            if (!targetKey || isNaN(amount) || amount <= 0) {
                alert("Informe uma chave válida e valor maior que zero.");
                return;
            }

            alert("Confirme com sua digital para autorizar a transferência no Omni Bank.");
            const bioSuccess = await verifyBiometrics();
            if (!bioSuccess) {
                alert("Biometria cancelada.");
                return;
            }

            const usersRef = db.ref('bank_users');

            try {
                const snapshot = await usersRef.once('value');
                let receiverId = null;
                const allUsers = snapshot.val();

                for (let uid in allUsers) {
                    if (allUsers[uid].key === targetKey) {
                        receiverId = uid;
                        break;
                    }
                }

                if (!receiverId) {
                    alert("Chave do jogador não encontrada!");
                    return;
                }

                const senderRef = db.ref('bank_users/' + sanitizedUserId);
                const receiverRef = db.ref('bank_users/' + receiverId);

                const senderSnap = await senderRef.once('value');
                if (senderSnap.val().balance < amount) {
                    alert("Saldo insuficiente.");
                    return;
                }

                const receiverSnap = await receiverRef.once('value');
                await senderRef.update({ balance: senderSnap.val().balance - amount });
                await receiverRef.update({ balance: receiverSnap.val().balance + amount });

                document.getElementById('target-key').value = '';
                document.getElementById('pay-amount').value = '';
                alert("Transferência realizada com sucesso!");
            } catch (err) {
                alert("Erro: " + err.message);
            }
        }

        function logout() {
            if (sanitizedUserId) {
                db.ref('game_players/' + sanitizedUserId).remove();
            }
            location.reload();
        }
    </script>
</body>
</html>
