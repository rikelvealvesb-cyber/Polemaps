<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusSheet - A Planilha Inteligente</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app-container">
        <!-- Menu Superior -->
        <header class="app-header">
            <div class="logo"><i class="fa-solid fa-layer-group"></i> <strong>NexusSheet</strong></div>
            <nav class="menu-bar">
                <span>Arquivo</span>
                <span>Editar</span>
                <span>Inserir</span>
                <span class="active">Dados & IA</span>
                <span>Ajuda</span>
            </nav>
        </header>

        <!-- Barra de Ferramentas Avançadas (Inovações vs Excel) -->
        <div class="toolbar">
            <button id="btn-fetch" title="Buscar dados de API externa direto na célula"><i class="fa-solid fa-globe"></i> API Fetch</button>
            <button id="btn-ai-prompt" title="Transformar dados usando linguagem natural"><i class="fa-solid fa-wand-magic-sparkles"></i> Comando IA</button>
            <button id="btn-history" title="Ver histórico/versionamento da célula"><i class="fa-solid fa-clock-rotate-left"></i> Histórico de Célula</button>
            <span class="separator"></span>
            <button><i class="fa-solid fa-bold"></i></button>
            <button><i class="fa-solid fa-italic"></i></button>
            <button><i class="fa-solid fa-align-left"></i></button>
        </div>

        <!-- Barra de Fórmulas e IA -->
        <div class="formula-bar">
            <span id="current-cell-indicator">A1</span>
            <i class="fa-solid fa-fx"></i>
            <input type="text" id="formula-input" placeholder="Digite um valor, fórmula (=SOMA) ou comando de IA (=FETCH, =IA)...">
        </div>

        <!-- Grade da Planilha (Grid) -->
        <div class="grid-container" id="grid-container">
            <!-- Gerado dinamicamente via JS -->
        </div>

        <!-- Rodapé / Abas -->
        <footer class="app-footer">
            <div class="sheet-tabs">
                <button class="tab active">Planilha 1</button>
                <button class="tab">+ Nova Aba</button>
            </div>
            <div class="status-bar" id="status-bar">Pronto | Modo Local Ativo</div>
        </footer>
    </div>

    <!-- Scripts Separados -->
    <script src="js/features.js"></script>
    <script src="js/sheet.js"></script>
</body>
</html>
