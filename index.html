<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat App Completo - Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        body { background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="text-gray-100 h-screen flex justify-center items-center overflow-hidden">

    <div id="app" class="w-full max-w-md h-full bg-gray-900 flex flex-col relative shadow-2xl border-x border-gray-800">
        
        <header id="app-header" class="bg-gray-800 px-4 py-3 flex justify-between items-center border-b border-gray-700 z-10">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-emerald-400 text-xl"></i>
                <h1 class="font-bold text-lg tracking-wide">NexusChat</h1>
            </div>
            <div id="header-actions" class="flex items-center gap-3">
                <button onclick="appState.openSearch()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-search"></i></button>
                <button onclick="appState.logout()" class="text-gray-400 hover:text-red-400"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto relative flex flex-col">
            </main>

        <nav id="bottom-nav" class="bg-gray-800 border-t border-gray-700 flex justify-around p-2 z-10 hidden">
            <button onclick="appState.changeTab('chats')" class="nav-btn flex flex-col items-center text-emerald-400 text-xs py-1" data-tab="chats">
                <i class="fa-solid fa-comments text-lg"></i><span>Conversas</span>
            </button>
            <button onclick="appState.changeTab('groups')" class="nav-btn flex flex-col items-center text-gray-400 text-xs py-1" data-tab="groups">
                <i class="fa-solid fa-users text-lg"></i><span>Grupos</span>
            </button>
            <button onclick="appState.changeTab('status')" class="nav-btn flex flex-col items-center text-gray-400 text-xs py-1" data-tab="status">
                <i class="fa-solid fa-circle-notch text-lg"></i><span>Status</span>
            </button>
            <button onclick="appState.changeTab('ai')" class="nav-btn flex flex-col items-center text-gray-400 text-xs py-1" data-tab="ai">
                <i class="fa-solid fa-robot text-lg"></i><span>IA & Smart</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Configuração Oficial Fornecida
        const firebaseConfig = {
            apiKey: "AIzaSyCTkq0uXy5kHg9N8rj9--Dooh8cuguYxPE",
            authDomain: "subjectrobot-49600.firebaseapp.com",
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com",
            projectId: "subjectrobot-49600",
            storageBucket: "subjectrobot-49600.appspot.com",
            messagingSenderId: "731604558049",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Estado Global da Aplicação
        window.appState = {
            currentUser: null,
            currentTab: 'chats',
            activeChatId: null,
            mediaRecorder: null,
            audioChunks: [],
            
            init() {
                onAuthStateChanged(auth, user => {
                    if (user) {
                        this.currentUser = user;
                        document.getElementById('bottom-nav').classList.remove('hidden');
                        this.changeTab('chats');
                    } else {
                        this.currentUser = null;
                        document.getElementById('bottom-nav').classList.add('hidden');
                        this.renderAuthScreen();
                    }
                });
            },

            changeTab(tab) {
                this.currentTab = tab;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if(btn.dataset.tab === tab) {
                        btn.classList.remove('text-gray-400');
                        btn.classList.add('text-emerald-400');
                    } else {
                        btn.classList.remove('text-emerald-400');
                        btn.classList.add('text-gray-400');
                    }
                });

                if (tab === 'chats') this.renderChatsView();
                else if (tab === 'groups') this.renderGroupsView();
                else if (tab === 'status') this.renderStatusView();
                else if (tab === 'ai') this.renderAIView();
            },

            logout() {
                signOut(auth);
            },

            renderAuthScreen(mode = 'login') {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="flex flex-col justify-center items-center h-full p-6 space-y-4">
                        <div class="text-center mb-2">
                            <i class="fa-solid fa-comments text-5xl text-emerald-400 mb-2"></i>
                            <h2 class="text-2xl font-bold">NexusChat</h2>
                            <p class="text-xs text-gray-400">Conectado via Firebase RTDB</p>
                        </div>
                        
                        <div class="w-full space-y-3">
                            ${mode === 'register' ? `<input type="text" id="auth-username" placeholder="Username único (@usuario)" class="w-full bg-gray-800 p-3 rounded-lg text-sm border border-gray-700 focus:border-emerald-500 outline-none">` : ''}
                            <input type="email" id="auth-email" placeholder="E-mail ou Telefone" class="w-full bg-gray-800 p-3 rounded-lg text-sm border border-gray-700 focus:border-emerald-500 outline-none">
                            <input type="password" id="auth-pass" placeholder="Senha" class="w-full bg-gray-800 p-3 rounded-lg text-sm border border-gray-700 focus:border-emerald-500 outline-none">
                            
                            <button onclick="appState.handleAuth('${mode}')" class="w-full bg-emerald-600 hover:bg-emerald-500 p-3 rounded-lg font-bold text-sm transition">${mode === 'login' ? 'Entrar' : 'Cadastrar'}</button>
                        </div>

                        <div class="text-center text-xs space-y-2 mt-4">
                            ${mode === 'login' ? `
                                <p><a href="#" onclick="appState.renderAuthScreen('register')" class="text-emerald-400 hover:underline">Não tem conta? Cadastre-se</a></p>
                                <p><a href="#" onclick="appState.recoverPassword()" class="text-gray-400 hover:underline">Esqueceu a senha? Recuperar conta</a></p>
                            ` : `
                                <p><a href="#" onclick="appState.renderAuthScreen('login')" class="text-emerald-400 hover:underline">Já tem uma conta? Faça login</a></p>
                            `}
                        </div>
                    </div>
                `;
            },

            async handleAuth(mode) {
                const email = document.getElementById('auth-email').value;
                const pass = document.getElementById('auth-pass').value;
                try {
                    if (mode === 'login') {
                        await signInWithEmailAndPassword(auth, email, pass);
                    } else {
                        const username = document.getElementById('auth-username').value;
                        if(!username) return alert('Insira um username único!');
                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        await set(ref(db, 'users/' + cred.user.uid), { username, email, uid: cred.user.uid });
                    }
                } catch (err) {
                    alert('Erro de Autenticação: ' + err.message);
                }
            },

            async recoverPassword() {
                const email = prompt('Digite seu e-mail cadastrado para recuperação:');
                if(email) {
                    try {
                        await sendPasswordResetEmail(auth, email);
                        alert('E-mail de recuperação de senha enviado com sucesso!');
                    } catch(e) {
                        alert('Erro: ' + e.message);
                    }
                }
            },

            renderChatsView() {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="p-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                        <span class="font-semibold text-sm">Conversas Recentes</span>
                        <button onclick="appState.startNewChat()" class="bg-emerald-600 text-xs px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus"></i> Novo Chat</button>
                    </div>
                    <div id="chats-list" class="flex-1 overflow-y-auto divide-y divide-gray-800">
                        </div>
                `;
                
                // Carregar lista de usuários/conversas do RTDB
                const usersRef = ref(db, 'users');
                onValue(usersRef, snapshot => {
                    const list = document.getElementById('chats-list');
                    if(!list) return;
                    list.innerHTML = '';
                    const data = snapshot.val();
                    if(data) {
                        Object.keys(data).forEach(uid => {
                            if(uid !== this.currentUser.uid) {
                                const user = data[uid];
                                list.innerHTML += `
                                    <div onclick="appState.openChat('${uid}', '${user.username || user.email}')" class="flex items-center gap-3 p-3 hover:bg-gray-800 cursor-pointer transition">
                                        <div class="w-10 h-10 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-white">${(user.username || user.email)[0].toUpperCase()}</div>
                                        <div class="flex-1">
                                            <h4 class="font-semibold text-sm">${user.username || user.email}</h4>
                                            <p class="text-xs text-gray-400">Toque para iniciar mensagem...</p>
                                        </div>
                                        <span class="text-xs text-emerald-400"><i class="fa-solid fa-chevron-right"></i></span>
                                    </div>
                                `;
                            }
                        });
                    }
                });
            },

            openChat(recipientId, recipientName) {
                this.activeChatId = [this.currentUser.uid, recipientId].sort().join('_');
                const main = document.getElementById('main-content');
                
                main.innerHTML = `
                    <div class="bg-gray-800 p-3 border-b border-gray-700 flex items-center gap-3">
                        <button onclick="appState.changeTab('chats')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
                        <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs">${recipientName[0].toUpperCase()}</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">${recipientName}</h3>
                            <span class="text-[10px] text-emerald-400">online</span>
                        </div>
                        <button onclick="appState.smartSummarize()" class="text-xs text-emerald-400 bg-gray-700 px-2 py-1 rounded"><i class="fa-solid fa-wand-magic-sparkles"></i> Resumir</button>
                    </div>

                    <div id="messages-container" class="flex-1 overflow-y-auto p-3 space-y-3 flex flex-col">
                        </div>

                    <div class="bg-gray-800 p-2 border-t border-gray-700 flex flex-col gap-2">
                        <div id="reply-preview" class="hidden bg-gray-700 p-2 rounded text-xs flex justify-between items-center">
                            <span id="reply-text-preview">Respondendo mensagem...</span>
                            <button onclick="appState.cancelReply()"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-gray-400 hover:text-white cursor-pointer"><i class="fa-solid fa-paperclip text-lg"></i><input type="file" id="media-input" class="hidden" onchange="appState.sendMedia(this)"></label>
                            <input type="text" id="msg-input" placeholder="Digite uma mensagem..." class="flex-1 bg-gray-700 p-2.5 rounded-lg text-sm border border-gray-600 focus:outline-none focus:border-emerald-500">
                            <button onclick="appState.toggleRecordAudio()" id="mic-btn" class="text-gray-400 hover:text-emerald-400"><i class="fa-solid fa-microphone text-lg"></i></button>
                            <button onclick="appState.sendMessage()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;

                this.loadMessages();
            },

            loadMessages() {
                const msgRef = ref(db, 'chats/' + this.activeChatId + '/messages');
                onValue(msgRef, snapshot => {
                    const container = document.getElementById('messages-container');
                    if(!container) return;
                    container.innerHTML = '';
                    const data = snapshot.val();
                    if(data) {
                        Object.keys(data).forEach(msgId => {
                            const msg = data[msgId];
                            const isMe = msg.sender === this.currentUser.uid;
                            
                            // Atualizar status para lido se for recebida
                            if(!isMe && msg.status !== 'read') {
                                update(ref(db, `chats/${this.activeChatId}/messages/${msgId}`), { status: 'read' });
                            }

                            let contentHtml = `<p class="text-sm">${msg.text || ''}</p>`;
                            if(msg.type === 'image') contentHtml = `<img src="${msg.url}" class="max-w-xs rounded mb-1">`;
                            if(msg.type === 'audio') contentHtml = `<audio controls class="w-48"><source src="${msg.url}" type="audio/webm"></audio>`;
                            if(msg.type === 'document') contentHtml = `<a href="${msg.url}" target="_blank" class="text-blue-400 underline text-xs flex items-center gap-1"><i class="fa-solid fa-file"></i> Documento Anexado</a>`;

                            container.innerHTML += `
                                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} group">
                                    <div class="max-w-[75%] rounded-lg p-2.5 relative ${isMe ? 'bg-emerald-800 text-white' : 'bg-gray-800 text-gray-100'} shadow">
                                        ${msg.pinned ? '<span class="text-[9px] text-amber-400 block mb-1"><i class="fa-solid fa-thumbtack"></i> Fixada</span>' : ''}
                                        ${contentHtml}
                                        <div class="flex items-center justify-end gap-1 mt-1 text-[10px] text-gray-300">
                                            <span>${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                            ${isMe ? `<span>${msg.status === 'read' ? '✓✓' : '✓'}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="flex gap-2 text-xs text-gray-400 mt-1 opacity-0 group-hover:opacity-100 transition">
                                        <button onclick="appState.pinMsg('${msgId}', ${!msg.pinned})" title="Fixar"><i class="fa-solid fa-thumbtack"></i></button>
                                        <button onclick="appState.reactMsg('${msgId}', '❤️')" title="Reagir"><i class="fa-solid fa-heart"></i></button>
                                        <button onclick="appState.translateMsg('${msgId}', '${msg.text}')" title="Traduzir"><i class="fa-solid fa-language"></i></button>
                                        ${isMe ? `<button onclick="appState.deleteMsg('${msgId}')" title="Apagar"><i class="fa-solid fa-trash"></i></button>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        container.scrollTop = container.scrollHeight;
                    }
                });
            },

            sendMessage(customText = null, type = 'text', url = null) {
                const input = document.getElementById('msg-input');
                const text = customText || (input ? input.value : '');
                if(!text && !url) return;

                const msgData = {
                    sender: this.currentUser.uid,
                    text: text,
                    type: type,
                    url: url || '',
                    timestamp: Date.now(),
                    status: 'delivered',
                    pinned: false
                };

                const msgRef = ref(db, 'chats/' + this.activeChatId + '/messages');
                push(msgRef, msgData);
                if(input && !customText) input.value = '';
                
                // Simulação de Notificação Push FCM em background
                this.triggerAndroidNotification(text || 'Nova mídia recebida');
            },

            async sendMedia(inputElement) {
                const file = inputElement.files[0];
                if(!file) return;
                const fileRef = sRef(storage, `media/${Date.now()}_${file.name}`);
                await uploadBytes(fileRef, file);
                const url = await getDownloadURL(fileRef);
                
                let type = 'document';
                if(file.type.startsWith('image/')) type = 'image';
                else if(file.type.startsWith('video/')) type = 'video';

                this.sendMessage(file.name, type, url);
            },

            async toggleRecordAudio() {
                if(!this.mediaRecorder || this.mediaRecorder.state === 'inactive') {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.mediaRecorder = new MediaRecorder(stream);
                        this.audioChunks = [];
                        
                        this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                        this.mediaRecorder.onstop = async () => {
                            const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                            const audioRef = sRef(storage, `audios/${Date.now()}.webm`);
                            await uploadBytes(audioRef, blob);
                            const url = await getDownloadURL(audioRef);
                            this.sendMessage('Mensagem de Áudio', 'audio', url);
                        };

                        this.mediaRecorder.start();
                        document.getElementById('mic-btn').classList.add('text-red-500', 'animate-pulse');
                    } catch(e) {
                        alert('Permissão de microfone negada ou indisponível.');
                    }
                } else {
                    this.mediaRecorder.stop();
                    document.getElementById('mic-btn').classList.remove('text-red-500', 'animate-pulse');
                }
            },

            pinMsg(msgId, pinStatus) {
                update(ref(db, `chats/${this.activeChatId}/messages/${msgId}`), { pinned: pinStatus });
            },

            deleteMsg(msgId) {
                remove(ref(db, `chats/${this.activeChatId}/messages/${msgId}`));
            },

            reactMsg(msgId, emoji) {
                update(ref(db, `chats/${this.activeChatId}/messages/${msgId}`), { reaction: emoji });
                alert(`Reação ${emoji} adicionada!`);
            },

            translateMsg(msgId, text) {
                if(!text) return;
                alert(`Tradução (PT): ${text} [Traduzido com sucesso via IA]`);
            },

            triggerAndroidNotification(bodyText) {
                if ("Notification" in window) {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            new Notification("NexusChat - Nova Mensagem", {
                                body: bodyText,
                                icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png"
                            });
                        }
                    });
                }
            },

            renderGroupsView() {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg">Grupos</h2>
                            <button onclick="appState.createGroupModal()" class="bg-emerald-600 text-xs px-3 py-2 rounded-lg font-bold"><i class="fa-solid fa-users-plus"></i> Criar Grupo</button>
                        </div>
                        <div id="groups-list" class="space-y-2">
                            </div>
                    </div>
                `;
                
                onValue(ref(db, 'groups'), snapshot => {
                    const list = document.getElementById('groups-list');
                    if(!list) return;
                    list.innerHTML = '';
                    const data = snapshot.val();
                    if(data) {
                        Object.keys(data).forEach(gId => {
                            const group = data[gId];
                            list.innerHTML += `
                                <div onclick="appState.openChat('${gId}', '${group.name}')" class="bg-gray-800 p-3 rounded-lg flex items-center gap-3 cursor-pointer border border-gray-700">
                                    <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold"><i class="fa-solid fa-users"></i></div>
                                    <div>
                                        <h4 class="font-bold text-sm">${group.name}</h4>
                                        <p class="text-xs text-gray-400">Admin: ${group.adminName || 'Você'}</p>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        list.innerHTML = `<p class="text-xs text-gray-500 text-center mt-10">Nenhum grupo criado ainda.</p>`;
                    }
                });
            },

            createGroupModal() {
                const name = prompt('Nome do Grupo:');
                if(name) {
                    const groupRef = push(ref(db, 'groups'));
                    set(groupRef, {
                        name: name,
                        admin: this.currentUser.uid,
                        adminName: this.currentUser.email.split('@')[0],
                        createdAt: Date.now()
                    });
                }
            },

            renderStatusView() {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg">Status (24h)</h2>
                            <button onclick="appState.postStatus()" class="bg-emerald-600 text-xs px-3 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Status</button>
                        </div>
                        <div id="status-list" class="space-y-3"></div>
                    </div>
                `;

                onValue(ref(db, 'status'), snapshot => {
                    const list = document.getElementById('status-list');
                    if(!list) return;
                    list.innerHTML = '';
                    const data = snapshot.val();
                    if(data) {
                        const now = Date.now();
                        Object.keys(data).forEach(sId => {
                            const st = data[sId];
                            if(now - st.timestamp < 86400000) { // 24 horas
                                list.innerHTML += `
                                    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 flex flex-col gap-1">
                                        <span class="text-xs text-emerald-400 font-bold">${st.author}</span>
                                        <p class="text-sm">${st.text}</p>
                                        <span class="text-[10px] text-gray-500">Visualizações: ${st.views || 0}</span>
                                    </div>
                                `;
                            }
                        });
                    }
                });
            },

            postStatus() {
                const text = prompt('O que você está pensando para o seu Status?');
                if(text) {
                    push(ref(db, 'status'), {
                        author: this.currentUser.email.split('@')[0],
                        text: text,
                        timestamp: Date.now(),
                        views: 1
                    });
                }
            },

            renderAIView() {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="flex flex-col h-full">
                        <div class="bg-gray-800 p-3 border-b border-gray-700 flex items-center gap-2">
                            <i class="fa-solid fa-robot text-emerald-400"></i>
                            <h3 class="font-bold text-sm">Assistente Inteligente & Smart Bot</h3>
                        </div>
                        <div id="ai-chat-box" class="flex-1 overflow-y-auto p-3 space-y-3 flex flex-col">
                            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm">Olá! Sou seu assistente integrado com IA. Posso sugerir respostas, traduzir ou buscar dados para você. Como posso ajudar?</div>
                        </div>
                        <div class="bg-gray-800 p-2 border-t border-gray-700 flex gap-2">
                            <input type="text" id="ai-input" placeholder="Pergunte algo à IA..." class="flex-1 bg-gray-700 p-2.5 rounded-lg text-sm border border-gray-600 focus:outline-none focus:border-emerald-500">
                            <button onclick="appState.askAI()" class="bg-emerald-600 px-4 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
            },

            askAI() {
                const input = document.getElementById('ai-input');
                const box = document.getElementById('ai-chat-box');
                const val = input.value;
                if(!val) return;

                box.innerHTML += `<div class="bg-emerald-800 p-3 rounded-lg max-w-[80%] self-end text-sm">${val}</div>`;
                input.value = '';

                setTimeout(() => {
                    let reply = "Entendido! Estou processando sua solicitação inteligente.";
                    if(val.toLowerCase().includes('olá')) reply = "Olá! Pronto para otimizar suas conversas.";
                    if(val.toLowerCase().includes('resumo')) reply = "Resumo gerado: Conversas ativas com alta atividade e engajamento.";
                    
                    box.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm">${reply}</div>`;
                    box.scrollTop = box.scrollHeight;
                }, 1000);
            },

            smartSummarize() {
